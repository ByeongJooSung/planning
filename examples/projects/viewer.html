<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planning Studio 뷰어</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root {
  --bg: #f3f5f8;
  --surface: #ffffff;
  --surface-2: #eef1f5;
  --ink: #16202c;
  --ink-2: #4a5566;
  --ink-3: #7b8594;
  --line: #d9dee5;
  --line-strong: #b9c1cc;
  --accent: #1f5e8c;
  --accent-soft: #e3edf5;
  --st-none: #7b8594;
  --st-none-bg: transparent;
  --st-prog: #a4470b;
  --st-prog-bg: #fcefdf;
  --st-done: #0e6b63;
  --st-done-bg: #dff1ee;
  --st-rev: #ffffff;
  --st-rev-bg: #1d7a45;
  --st-excl: #8a94a3;
  --warn: #a4470b;
  --crit: #b42318;
  --crit-bg: #fdecea;
  --add: #1d7a45;
  --del: #b42318;
  --chg: #a4470b;
  --font: "IBM Plex Sans KR", system-ui, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0f141a;
    --surface: #161d26;
    --surface-2: #1d2631;
    --ink: #e5e9ef;
    --ink-2: #a8b2bf;
    --ink-3: #7c8694;
    --line: #2a3441;
    --line-strong: #3a4656;
    --accent: #72b4e2;
    --accent-soft: #1b2e3f;
    --st-none: #8c96a4;
    --st-prog: #f2a766;
    --st-prog-bg: #3a2616;
    --st-done: #5fcfc1;
    --st-done-bg: #133330;
    --st-rev: #0f141a;
    --st-rev-bg: #58c98a;
    --st-excl: #6d7785;
    --warn: #f2a766;
    --crit: #f38b82;
    --crit-bg: #3a1c1a;
    --add: #58c98a;
    --del: #f38b82;
    --chg: #f2a766;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0f141a;
  --surface: #161d26;
  --surface-2: #1d2631;
  --ink: #e5e9ef;
  --ink-2: #a8b2bf;
  --ink-3: #7c8694;
  --line: #2a3441;
  --line-strong: #3a4656;
  --accent: #72b4e2;
  --accent-soft: #1b2e3f;
  --st-none: #8c96a4;
  --st-prog: #f2a766;
  --st-prog-bg: #3a2616;
  --st-done: #5fcfc1;
  --st-done-bg: #133330;
  --st-rev: #0f141a;
  --st-rev-bg: #58c98a;
  --st-excl: #6d7785;
  --warn: #f2a766;
  --crit: #f38b82;
  --crit-bg: #3a1c1a;
  --add: #58c98a;
  --del: #f38b82;
  --chg: #f2a766;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.55;
}
.mono, code { font-family: var(--mono); font-size: 0.92em; letter-spacing: -0.01em; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ── Shell ─────────────────────────────── */
.shell { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100vh; }
.side {
  border-right: 1px solid var(--line); background: var(--surface); padding: 20px 14px;
  display: flex; flex-direction: column; gap: 16px; position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; overflow-y: auto;
}
.brand { display: flex; flex-direction: column; gap: 2px; padding-inline: 8px; }
.brand b { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; }
.brand span { color: var(--ink-3); font-size: 12px; }
.side-label { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: var(--ink-3); padding: 0 8px 4px; }
.nav-group { display: flex; flex-direction: column; gap: 2px; }
.nav-item {
  display: flex; justify-content: space-between; align-items: center; gap: 8px; text-align: left; background: none; border: 0;
  border-radius: 7px; padding: 8px 10px; cursor: pointer; color: var(--ink-2); font-weight: 500;
}
.nav-item:hover { background: var(--surface-2); color: var(--ink); }
.nav-item[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav-item .n { font-family: var(--mono); font-size: 11px; color: var(--ink-3); }
.back { align-self: flex-start; background: none; border: 0; color: var(--ink-2); cursor: pointer; padding: 4px 8px; font-size: 12.5px; }
.back:hover { color: var(--accent); }
.proj-id { display: flex; flex-direction: column; gap: 2px; padding: 10px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface-2); }
.proj-id .code { font-family: var(--mono); font-size: 11px; color: var(--ink-3); }
.proj-id b { font-size: 14px; line-height: 1.35; }
.lnb-select { display: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.side-foot { margin-top: auto; color: var(--ink-3); font-size: 11.5px; padding-inline: 8px; }

.main { padding-inline: 32px; padding-block: 26px 64px; min-width: 0; display: flex; flex-direction: column; gap: 20px; }
.page-head { display: flex; flex-direction: column; gap: 4px; }
.page-head h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.page-head > p { margin: 0; color: var(--ink-2); max-width: 78ch; }
.eyebrow { font-size: 12px; color: var(--ink-3); font-weight: 500; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; align-items: center; }
.tag {
  display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line);
  border-radius: 999px; padding: 1px 9px; font-size: 12px; color: var(--ink-2); background: var(--surface);
}
.tag .dot { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
.crumbs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12.5px; color: var(--ink-3); }
.crumbs button { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font: inherit; }
.tabs {
  display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto;
  scrollbar-width: none; position: sticky; top: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 5;
}
.tab { background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 14px; cursor: pointer; color: var(--ink-2); white-space: nowrap; font-weight: 500; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
.panel { display: flex; flex-direction: column; gap: 20px; }
.section { display: flex; flex-direction: column; gap: 10px; }
.section > h2 { font-size: 15px; font-weight: 600; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.section > h2 small { font-weight: 400; color: var(--ink-3); font-size: 12.5px; }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.hint { color: var(--ink-3); font-size: 12.5px; }
.warn-t { color: var(--warn); font-weight: 500; }
.lnk { background: none; border: 0; padding: 0; font: inherit; color: var(--accent); cursor: pointer; text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--accent) 40%, transparent); text-underline-offset: 2px; }
.note { border: 1px dashed var(--line-strong); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; background: var(--surface); }
.note.row { flex-direction: row; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 20px; }
.note.row > div:first-child { flex: 1 1 360px; }
.note p { margin: 0; }
.note.warn { border-style: solid; border-color: var(--st-prog); background: var(--st-prog-bg); }
.cmd { display: flex; align-items: center; gap: 8px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 6px 6px 10px; max-width: 100%; }
.cmd code { flex: 1; min-width: 0; overflow-x: auto; white-space: nowrap; font-size: 12px; }
.btn-sm { background: var(--surface); border: 1px solid var(--line-strong); border-radius: 6px; padding: 3px 10px; cursor: pointer; font-size: 12px; color: var(--ink); white-space: nowrap; }
.btn-sm:hover { border-color: var(--accent); color: var(--accent); }
.auto { display: inline-block; font-size: 10.5px; font-weight: 700; color: var(--accent); border: 1px solid var(--accent); border-radius: 4px; padding: 0 4px; margin-left: 6px; line-height: 16px; vertical-align: 1px; cursor: help; }

/* ── Home ──────────────────────────────── */
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
.pcard { text-align: left; cursor: pointer; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; font: inherit; color: inherit; transition: border-color .15s, box-shadow .15s; }
.pcard:hover { border-color: var(--accent); box-shadow: 0 4px 16px color-mix(in srgb, var(--accent) 14%, transparent); }
.pcard.new { cursor: default; border-style: dashed; justify-content: center; }
.pcard.new:hover { border-color: var(--line); box-shadow: none; }
.pcard.new p { margin: 0; }
.pc-top { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.pc-top .code { font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); }
.pc-name { font-size: 17px; letter-spacing: -0.01em; }
.pc-sys { display: flex; flex-wrap: wrap; gap: 5px; }
.track { display: flex; gap: 3px; }
.trk { flex: 1; display: flex; flex-direction: column; gap: 3px; }
.trk i { height: 5px; border-radius: 2px; background: var(--line); }
.trk em { font-style: normal; font-family: var(--mono); font-size: 10px; color: var(--ink-3); }
.trk.CONFIRMED i { background: var(--st-rev-bg); }
.trk.DRAFTED i, .trk.IN_REVIEW i, .trk.GATE_PASSED i { background: var(--st-done); }
.trk.COLLECTING i, .trk.NEEDS_UPDATE i { background: var(--st-prog); }
.trk.SKIPPED i { background: repeating-linear-gradient(90deg, var(--line) 0 3px, transparent 3px 6px); }
.pc-rate { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.pc-nums { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 0; border-top: 1px solid var(--line); padding-top: 10px; }
.pc-nums div { display: flex; flex-direction: column; }
.pc-nums dt { font-size: 11px; color: var(--ink-3); }
.pc-nums dd { margin: 0; font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
.pc-nums .warn dd { color: var(--crit); }
.pc-foot { font-size: 11.5px; color: var(--ink-3); }

/* ── Pills & chips ─────────────────────── */
.pill {
  display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 0 8px;
  font-size: 11.5px; font-weight: 600; line-height: 20px; white-space: nowrap; border: 1px solid transparent;
}
.pill.NOT_STARTED { color: var(--st-none); border-color: var(--line-strong); border-style: dashed; }
.pill.IN_DESIGN { color: var(--st-prog); background: var(--st-prog-bg); }
.pill.DESIGNED { color: var(--st-done); background: var(--st-done-bg); border-color: var(--st-done); }
.pill.REVIEWED { color: var(--st-rev); background: var(--st-rev-bg); }
.pill.EXCLUDED { color: var(--st-excl); text-decoration: line-through; border-color: var(--line); }
.sys {
  display: inline-flex; align-items: center; gap: 5px; font-family: var(--mono); font-size: 11.5px;
  font-weight: 500; color: var(--ink-2); white-space: nowrap;
}
.sys i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; flex: none; }
.chg { font-size: 10.5px; font-weight: 700; letter-spacing: 0.04em; padding: 0 5px; border-radius: 4px; border: 1px solid; }
.chg.NEW { color: var(--add); }
.chg.CHANGED { color: var(--chg); }
.chg.DELETED { color: var(--del); text-decoration: line-through; }
.chg.KEPT { color: var(--ink-3); }

/* ── Dashboard ─────────────────────────── */
.stages { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 0; overflow: hidden; }
.stage { padding: 12px 14px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; position: relative; }
.stage:last-child { border-right: 0; }
.stage .sid { font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); }
.stage .sname { font-weight: 600; font-size: 13px; }
.stage .sst { font-size: 12px; font-weight: 600; }
.stage::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: var(--line); }
.stage.CONFIRMED::after { background: var(--st-rev-bg); }
.stage.DRAFTED::after, .stage.IN_REVIEW::after, .stage.GATE_PASSED::after { background: var(--st-done); }
.stage.COLLECTING::after, .stage.NEEDS_UPDATE::after { background: var(--st-prog); }
.stage.SKIPPED .sname { color: var(--ink-3); text-decoration: line-through; }
.stage.CONFIRMED .sst { color: var(--add); }
.stage.DRAFTED .sst, .stage.IN_REVIEW .sst, .stage.GATE_PASSED .sst { color: var(--st-done); }
.stage.COLLECTING .sst, .stage.NEEDS_UPDATE .sst { color: var(--st-prog); }
.stage.NOT_STARTED .sst, .stage.SKIPPED .sst { color: var(--ink-3); }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.kpi { padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; }
.kpi .v { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.kpi .v small { font-size: 14px; color: var(--ink-3); font-weight: 500; margin-left: 2px; }
.kpi .l { color: var(--ink-2); font-size: 12.5px; }
.kpi.alert .v { color: var(--crit); }

.dash-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
.bars { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.bar-row { display: grid; grid-template-columns: 150px minmax(0, 1fr) 104px; gap: 12px; align-items: center; }
.bar-row .lbl { display: flex; flex-direction: column; gap: 0; min-width: 0; }
.bar-row .lbl span { color: var(--ink-3); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar { height: 12px; background: var(--surface-2); border-radius: 3px; position: relative; overflow: hidden; }
.bar > b { position: absolute; inset: 0 auto 0 0; border-radius: 3px; }
.bar-row .num { font-family: var(--mono); font-size: 12px; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.axis { display: grid; grid-template-columns: 150px minmax(0, 1fr) 104px; gap: 12px; color: var(--ink-3); font-size: 10.5px; font-family: var(--mono); }
.axis div { display: flex; justify-content: space-between; }
.stack { display: flex; height: 14px; border-radius: 3px; overflow: hidden; background: var(--surface-2); }
.stack > span { height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--ink-2); }
.legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; margin-right: 5px; vertical-align: -1px; }

.issues { display: flex; flex-direction: column; }
.issue { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 10px; padding: 9px 14px; border-top: 1px solid var(--line); font-size: 13px; }
.issue:first-child { border-top: 0; }
.issue .st { font-family: var(--mono); font-size: 11.5px; font-weight: 600; color: var(--warn); padding-top: 1px; }
.issue.orphan .st { color: var(--crit); }
.empty { padding: 18px; color: var(--ink-3); text-align: center; }

/* ── Requirements ──────────────────────── */
.req { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.req-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
.req-id { font-family: var(--mono); font-weight: 600; font-size: 13px; }
.req-title { font-weight: 600; font-size: 14.5px; }
.req-sub { color: var(--ink-3); font-size: 12px; display: flex; flex-wrap: wrap; gap: 4px 12px; }
.req-desc { color: var(--ink-2); font-size: 13px; max-width: 72ch; }
.chain { display: flex; flex-direction: column; gap: 0; border-left: 2px solid var(--line); margin-left: 6px; }
.step { display: grid; grid-template-columns: 50px 56px minmax(0, 1fr) auto 14px; gap: 10px; align-items: baseline; padding: 8px 8px 8px 16px; position: relative; background: none; border: 0; text-align: left; cursor: pointer; border-radius: 0 8px 8px 0; width: 100%; }
.step:hover { background: var(--surface-2); }
.step .go { color: var(--ink-3); font-size: 18px; line-height: 1; }
.step::before { content: ""; position: absolute; left: -6px; top: 15px; width: 10px; height: 10px; border-radius: 50%; background: var(--surface); border: 2px solid var(--sys, var(--line-strong)); }
.step .tid { font-family: var(--mono); font-size: 12px; color: var(--ink-2); }
.step .act b { font-weight: 500; }
.step .act .who { color: var(--ink-3); margin-right: 6px; }
.step .tr { display: block; font-size: 11.5px; color: var(--ink-3); }
.step .tr code { color: var(--ink-2); }
.notask { color: var(--warn); font-size: 12.5px; font-weight: 500; }

/* ── Tables ────────────────────────────── */
.toolbar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { background: none; border: 0; padding: 6px 12px; cursor: pointer; color: var(--ink-2); border-left: 1px solid var(--line); }
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--surface); font-weight: 600; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.fchip {
  display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 3px 10px; cursor: pointer; font-size: 12px;
}
.fchip i { width: 9px; height: 9px; border-radius: 2px; }
.fchip[aria-pressed="false"] { opacity: 0.45; }
.twrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
th, td { border-bottom: 1px solid var(--line); padding: 7px 10px; text-align: left; vertical-align: top; }
th { background: var(--surface-2); font-weight: 600; color: var(--ink-2); font-size: 11.5px; white-space: nowrap; position: sticky; top: 0; }
td.id, td .id { font-family: var(--mono); font-size: 11.5px; white-space: nowrap; }
td.req-cell { background: var(--surface); border-right: 1px solid var(--line); }
tr.muted td { color: var(--ink-3); }
tr.orphan td:first-child { box-shadow: inset 3px 0 0 var(--crit); }
.ids { display: flex; flex-direction: column; gap: 1px; font-family: var(--mono); font-size: 11.5px; }
.dash { color: var(--line-strong); }
.cell { display: flex; flex-direction: column; gap: 4px; min-width: 150px; }
.cell .t { font-family: var(--mono); font-size: 11.5px; font-weight: 600; }
.cell .s { font-family: var(--mono); font-size: 11px; color: var(--ink-3); }
.cell .s.none { color: var(--warn); font-family: var(--font); }

/* ── IA ────────────────────────────────── */
.ia-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.ia-col { overflow: hidden; }
.ia-col h3 { font-size: 13.5px; padding: 10px 14px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; }
.ia-col h3 i { width: 10px; height: 10px; border-radius: 2px; }
.ia-col h3 span { color: var(--ink-3); font-weight: 400; font-size: 12px; margin-left: auto; font-family: var(--mono); }
.tree, .tree ul { list-style: none; margin: 0; padding: 0; }
.tree { padding: 8px 10px 12px; }
.tree ul { padding-left: 16px; border-left: 1px dashed var(--line-strong); margin-left: 6px; }
.node { padding: 5px 4px; display: flex; flex-direction: column; gap: 1px; }
.node .top { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.node .nm { font-weight: 500; }
.node.MENU > .top .nm { font-weight: 700; }
.node .sid { font-family: var(--mono); font-size: 11.5px; color: var(--accent); }
.node .kind { font-size: 10.5px; color: var(--ink-3); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
.node .tk { font-family: var(--mono); font-size: 11px; color: var(--ink-3); }
.node .tk.none { color: var(--crit); font-family: var(--font); }

/* ── Flow ──────────────────────────────── */
.flow-box { overflow-x: auto; padding: 8px; }
.flow-box svg { display: block; }
.flow-box text { fill: var(--ink); font-family: var(--font); }
.flow-box .lane-label { font-size: 12px; font-weight: 600; }
.flow-box .lane-line { stroke: var(--line); }
.flow-box .shape { fill: var(--surface); stroke: var(--ink-2); stroke-width: 1.4; }
.flow-box .shape.TERMINATOR { fill: var(--surface-2); }
.flow-box .shape.DECISION { fill: var(--st-prog-bg); stroke: var(--st-prog); }
.flow-box .nlabel { font-size: 12px; font-weight: 500; }
.flow-box .nsid { font-size: 10px; font-family: var(--mono); fill: var(--accent); }
.flow-box .ntask { font-size: 9.5px; font-family: var(--mono); fill: var(--ink-3); }
.flow-box .edge { fill: none; stroke: var(--ink-3); stroke-width: 1.3; }
.flow-box .edge.back { stroke-dasharray: 4 3; stroke: var(--st-prog); }
.flow-box .arrow { fill: var(--ink-3); }
.flow-box .arrow.back { fill: var(--st-prog); }
.flow-box .elabel { font-size: 11px; font-weight: 600; fill: var(--ink-2); paint-order: stroke; stroke: var(--surface); stroke-width: 4px; }

/* ── Versions ──────────────────────────── */
.snaps { display: flex; flex-wrap: wrap; gap: 10px; }
.snap { padding: 10px 14px; display: flex; flex-direction: column; gap: 2px; min-width: 180px; }
.snap .v { font-family: var(--mono); font-weight: 600; }
.snap .d { color: var(--ink-3); font-size: 12px; }
.snap.current { border-color: var(--accent); }
.diff-group { padding: 12px 16px; display: flex; flex-direction: column; gap: 6px; border-top: 1px solid var(--line); }
.diff-group:first-child { border-top: 0; }
.diff-group h3 { font-size: 13px; }
.drow { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; font-size: 13px; }
.drow .k { font-size: 11px; font-weight: 700; width: 34px; flex: none; }
.drow .k.add { color: var(--add); }
.drow .k.del { color: var(--del); }
.drow .k.chg { color: var(--chg); }
.fields { margin: 2px 0 0 42px; display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: var(--ink-2); }
.fields del { color: var(--del); }
.fields ins { color: var(--add); text-decoration: none; }


/* ── Dashboard extras ──────────────────── */
.dash-3 { display: grid; grid-template-columns: minmax(0, 0.7fr) minmax(0, 1fr) minmax(0, 1.3fr); gap: 16px; }
.tile { text-align: left; font: inherit; color: inherit; cursor: pointer; padding: 16px; display: flex; flex-direction: column; gap: 4px; }
.tile:hover { border-color: var(--accent); }
.tile b { font-size: 26px; font-variant-numeric: tabular-nums; }
.tile b small { font-size: 14px; color: var(--ink-3); font-weight: 500; margin-left: 2px; }
.tile span { color: var(--ink-2); font-size: 12.5px; }
.mini { display: flex; flex-direction: column; }
.mini-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 12px; border: 0; border-top: 1px solid var(--line); background: none; text-align: left; font: inherit; color: inherit; cursor: pointer; font-size: 12.5px; }
.mini-row:first-child { border-top: 0; }
.mini-row:hover { background: var(--surface-2); }
.mini-row.static { cursor: default; }
.mini-row.static:hover { background: none; }
.mini-row span:nth-child(2) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mini-row em { font-style: normal; font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.stack-wrap { display: flex; flex-direction: column; gap: 8px; padding-top: 6px; border-top: 1px solid var(--line); }
.issues { max-height: 460px; overflow-y: auto; }
.igroup { border-top: 1px solid var(--line); }
.igroup:first-child { border-top: 0; }
.igroup summary { cursor: pointer; padding: 10px 14px; display: flex; gap: 10px; align-items: baseline; font-size: 13px; font-weight: 500; }
.igroup summary b { color: var(--warn); font-variant-numeric: tabular-nums; }
.igroup summary .st { font-family: var(--mono); font-size: 11.5px; font-weight: 600; color: var(--warn); width: 34px; }
.igroup.orphan summary .st, .igroup.orphan summary b { color: var(--crit); }
.igroup .issue { display: block; padding: 6px 14px 6px 58px; border-top: 1px dashed var(--line); font-size: 12.5px; color: var(--ink-2); }

/* ── Knowledge ─────────────────────────── */
.kb-search { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.kb-label { font-weight: 600; }
.kb-row input { width: 100%; font: inherit; font-size: 15px; padding: 10px 12px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface); color: var(--ink); }
.kb-row input:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
.kb-results { display: flex; flex-direction: column; gap: 8px; }
.hit { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; }
.hit-h { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; font-size: 12.5px; }
.hit-h .score { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--ink-3); }
.hit p { margin: 0; font-size: 13px; white-space: pre-line; color: var(--ink-2); }
.hit mark { background: color-mix(in srgb, var(--st-prog) 22%, transparent); color: var(--ink); border-radius: 2px; }
td.num { font-family: var(--mono); font-size: 11.5px; white-space: nowrap; }

/* ── Task detail ───────────────────────── */
.info { margin: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.info > div { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 10px; padding: 10px 14px; border-top: 1px solid var(--line); font-size: 13px; }
.info > div:nth-child(-n+2) { border-top: 0; }
.info dt { color: var(--ink-3); font-size: 12px; font-weight: 600; }
.info dd { margin: 0; min-width: 0; }
.chain-t { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.chip-t { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 1px 7px; font-family: var(--mono); font-size: 11.5px; cursor: pointer; color: var(--ink-2); }
.chip-t i { width: 8px; height: 8px; border-radius: 2px; background: var(--sys); }
.chip-t.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.arrow-t { color: var(--ink-3); }
.flow-box .hl { stroke: var(--accent) !important; stroke-width: 2.6 !important; }
.flow-box .dim { opacity: 0.38; }
.flow-box .nlabel.conn { font-size: 10.5px; fill: var(--ink-2); }
.flow-box .shape.CONNECTOR { fill: var(--surface-2); stroke-dasharray: 3 3; }

.sheet { overflow: hidden; display: flex; flex-direction: column; }
.sheet-head { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.sheet-head th { background: var(--surface-2); color: var(--ink-2); width: 84px; font-weight: 600; font-size: 11.5px; border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); padding: 7px 10px; position: static; }
.sheet-head td { border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); padding: 7px 10px; }
.sheet-body { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); }
.wire-box { padding: 16px; border-right: 1px solid var(--line); background: var(--surface-2); min-width: 0; }
.wire-missing { padding: 28px; border-right: 1px solid var(--line); background: var(--surface-2); display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.wire-missing p { margin: 0; }
.desc-wrap { overflow-x: auto; }
table.desc th { position: static; }
table.desc td p { margin: 0 0 4px; }
table.desc td p:last-child { margin-bottom: 0; }
.lens { display: inline-block; font-size: 10.5px; font-weight: 700; border-radius: 4px; padding: 0 5px; margin-right: 6px; background: var(--accent-soft); color: var(--accent); }
.lens.cust { background: var(--st-done-bg); color: var(--st-done); }
.no { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: #e5484d; color: #fff; font: 700 11px var(--mono); }
.msg { color: var(--ink-2); font-size: 12px; }
.proto-bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip-s { font-family: var(--mono); font-size: 11.5px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 10px; cursor: pointer; color: var(--ink-2); }
.chip-s em { font-style: normal; font-family: var(--font); font-size: 10.5px; color: var(--ink-3); }
.chip-s.on { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.chip-s.on em { color: inherit; }
.proto-frame { border: 1px solid var(--line-strong); border-radius: 10px; background: #d9dde3; padding: 14px; box-shadow: inset 0 1px 3px rgba(0,0,0,.08); }

/* ── Design system ─────────────────────── */
.fchip em { font-style: normal; font-size: 10.5px; border-radius: 4px; padding: 0 5px; }
.fchip em.ok { color: var(--st-done); background: var(--st-done-bg); }
.fchip em.wait { color: var(--st-prog); background: var(--st-prog-bg); }
.concepts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; align-items: start; }
.concept { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.concept-h { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 10px; }
.concept-h b { font-size: 16px; }
.concept-h p { margin: 4px 0 0; font-size: 12.5px; color: var(--ink-2); }
.cid { width: 30px; height: 30px; border-radius: 8px; background: var(--ink); color: var(--surface); display: grid; place-items: center; font-weight: 700; font-family: var(--mono); }
.fit { margin: 0; font-size: 12.5px; color: var(--ink-2); }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.sw { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: var(--ink-3); }
.sw i { width: 16px; height: 16px; border-radius: 4px; border: 1px solid var(--line); display: inline-block; }
.lchips { display: flex; flex-wrap: wrap; gap: 4px; }
.lchips .tag { font-size: 11px; padding: 0 7px; }
.thumbs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.section > .thumbs { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.thumb { margin: 0; display: flex; flex-direction: column; gap: 4px; }
.thumb-in { border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: #fff; padding: 0; cursor: zoom-in; display: block; width: 100%; }
.thumb-in:hover { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 30%, transparent); }
.thumb figcaption { font-size: 11.5px; color: var(--ink-2); font-weight: 500; display: flex; justify-content: space-between; gap: 6px; }
.thumb figcaption .hint { font-family: var(--mono); font-size: 10.5px; }
.pick { display: flex; flex-direction: column; gap: 4px; border-top: 1px solid var(--line); padding-top: 10px; }
.ds-head { padding: 16px 18px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px; }
.ds-head h2 { font-size: 19px; }
.ds-head p { margin: 4px 0 0; max-width: 64ch; }
.pminis { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-start; }
.pmini { padding: 10px; display: flex; flex-direction: column; gap: 6px; min-width: 150px; opacity: 0.7; }
.pmini.on { opacity: 1; border-color: var(--accent); }
.pmini .cid { width: 24px; height: 24px; font-size: 12px; border-radius: 6px; }
.ds-grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
.ds-grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.pad { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.pad h3, h3.cat { font-size: 13.5px; }
h3.cat { margin-top: 6px; }
h3.cat small { color: var(--ink-3); font-weight: 400; }
.colors { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.color { display: grid; grid-template-columns: 30px minmax(0, 1fr); grid-template-rows: auto auto; column-gap: 8px; font-size: 12px; align-items: center; }
.color i { grid-row: span 2; width: 30px; height: 30px; border-radius: 6px; border: 1px solid var(--line); }
.color .mono { color: var(--ink-3); font-size: 11px; }
.type-row { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 10px; align-items: baseline; border-top: 1px solid var(--line); padding-top: 6px; overflow: hidden; }
.type-row .mono { font-size: 11px; color: var(--ink-3); }
.type-row span:last-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gridviz { display: grid; grid-template-columns: repeat(12, 1fr); gap: 4px; height: 44px; }
.gridviz i { background: color-mix(in srgb, var(--accent) 22%, transparent); border-radius: 2px; }
.radii { display: flex; gap: 10px; }
.radii span { width: 64px; height: 44px; border: 1.5px solid var(--ink-2); display: grid; place-items: center; font-size: 11px; font-family: var(--mono); background: var(--surface); }
.icons { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); padding: 8px; gap: 4px; }
.icon { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 10px 4px; border-radius: 8px; font-size: 12px; }
.icon:hover { background: var(--surface-2); }
.icon .mono { font-size: 10.5px; color: var(--ink-3); }
.comps { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.comp { padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.comp.wide { grid-column: 1 / -1; }
.comp.added { border-color: var(--st-prog); }
.comp-h { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; }
.comp-h .mono { font-size: 11px; color: var(--ink-3); }
.comp p { margin: 0; }
.comp-demo { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; padding: 8px; background: var(--surface-2); }
.ds-sample { padding: 20px; position: relative; }
.ds-sample.flush { padding: 0; }
.ds-sample .wf-overlay { position: static; background: none; padding: 0; }
.ds-sample .wf-toast-wrap { position: static; }

@media (max-width: 1100px) {
  .concepts { grid-template-columns: minmax(0, 1fr); }
  .concept .thumbs { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
  .dash-3 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .dash-3 > :first-child { grid-column: 1 / -1; }
  .sheet-body { grid-template-columns: minmax(0, 1fr); }
  .wire-box, .wire-missing { border-right: 0; border-bottom: 1px solid var(--line); }
}
@media (max-width: 900px) {
  .dash-grid, .ds-grid2, .ds-grid3 { grid-template-columns: minmax(0, 1fr); }
  .info { grid-template-columns: minmax(0, 1fr); }
  .info > div:nth-child(2) { border-top: 1px solid var(--line); }
}
@media (max-width: 760px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 12px 16px; flex-direction: row; align-items: center; gap: 12px; }
  .nav-group, .side-foot, .back, .proj-id, .brand span { display: none; }
  .lnb-select { display: block; flex: 1; min-width: 0; padding: 7px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); font: inherit; }
  .main { padding-inline: 16px; }
  .pgrid { grid-template-columns: minmax(0, 1fr); }
  .dash-3 { grid-template-columns: minmax(0, 1fr); }
  .bar-row, .axis { grid-template-columns: 88px minmax(0, 1fr) 92px; }
  .step { grid-template-columns: 44px minmax(0, 1fr) 14px; }
  .step .sys, .step .pill { grid-column: 2; justify-self: start; }
  .step .go { grid-column: 3; grid-row: 1; }
  .section > .thumbs { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: no-preference) {
  .bar > b, .stack > span { transition: width 0.4s ease; }
}

/* ── 실제 규격 스테이지 ────────────────── */
.stage { position: relative; width: 100%; overflow: hidden; }
.stage-in { position: absolute; top: 0; left: 0; transform-origin: 0 0; background: #fff; }
.stage-in.fixed { overflow: hidden; }
.stage-cap { display: flex; justify-content: space-between; gap: 8px; margin-top: 6px; font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); }
.fold { position: absolute; left: 0; right: 0; border-top: 3px dashed #e5484d; pointer-events: none; z-index: 20; }
.fold span { position: absolute; right: 12px; top: 6px; background: #e5484d; color: #fff; font: 600 22px var(--mono); padding: 2px 10px; border-radius: 4px; }
.wire-box .stage { box-shadow: 0 1px 4px rgba(0,0,0,.12); }

/* ── AI 요청 · 레이어 ─────────────────── */
.ai-btn {
  display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--accent); background: var(--accent-soft); color: var(--accent);
  border-radius: 999px; padding: 4px 12px; font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer; white-space: nowrap;
}
.ai-btn:hover { background: var(--accent); color: var(--surface); }
.ai-bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.sheet-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.sheet-bar .sp, .proto-bar .sp { flex: 1; }
.layer { position: fixed; inset: 0; z-index: 100; background: rgba(10, 14, 20, 0.55); display: grid; place-items: center; padding: 24px 16px; }
.layer-box { width: min(920px, 100%); max-height: calc(100vh - 48px); background: var(--surface); border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,.35); display: flex; flex-direction: column; overflow: hidden; }
.layer-box.wide { width: min(1680px, 100%); }
.layer-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 16px 18px 10px; border-bottom: 1px solid var(--line); }
.layer-h h2 { font-size: 17px; }
.layer-h .x { background: none; border: 0; font-size: 18px; cursor: pointer; color: var(--ink-2); padding: 2px 6px; border-radius: 6px; }
.layer-h .x:hover { background: var(--surface-2); }
.layer-tools { padding: 12px 18px 0; display: flex; flex-direction: column; gap: 6px; }
.layer-tools p { margin: 0; }
.layer-meta { padding: 10px 18px; display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 12px; font-size: 12.5px; }
.layer-meta ul { margin: 4px 0 0; padding-left: 18px; }
.layer-meta li { word-break: break-all; }
.layer-meta a { color: var(--accent); }
.layer-meta p { margin: 4px 0 0; }
.layer-pre { margin: 0 18px; flex: 1; min-height: 160px; overflow: auto; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; font: 12.5px/1.6 var(--mono); white-space: pre-wrap; color: var(--ink); }
.layer-f { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 18px 16px; }
.btn-primary { background: var(--accent); color: var(--surface); border: 0; border-radius: 8px; padding: 9px 18px; font: inherit; font-weight: 600; cursor: pointer; }
.btn-primary:hover { filter: brightness(1.08); }
.layer-stage { padding: 16px 18px 18px; overflow: auto; background: var(--surface-2); }
@media (max-width: 700px) { .layer-meta { grid-template-columns: minmax(0, 1fr); } }

/* 와이어프레임: 모든 값은 디자인 시스템 토큰(--w-*)에서 온다. 뷰어 테마와 무관하게 설계 화면 그대로 보인다. */
.wf {
  position: relative; background: var(--w-bg); color: var(--w-text); font-family: var(--w-font); font-size: var(--w-body);
  line-height: 1.5; text-align: left; overflow: hidden; color-scheme: light;
  display: flex; flex-direction: column; min-height: 100%;
}
.wf > .wf-main { flex: 1 0 auto; }
.stage-in.fixed > .wf { height: 100%; }
.stage-in.pg > .wf { min-height: 1080px; }
/* 프로토타입: 1920×1080 뷰포트 안에서 화면이 스크롤된다. 확인 창·토스트는 뷰포트(.wf-vp)에 붙는다 */
.wf-vp { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: var(--w-font); }
.wf-vp > .wf { height: 100%; overflow-y: auto; }
/* 실제 규격 고정 배치: 한 줄 요소는 줄바꿈하지 않는다 */
.wf-menu span, .wf-utl, .wf-logo, .wf-bc, .wf-lbl, .wf-badge, .wf-btn, .wf-tabs span, .wf-steps li, .wf-opt, .wf-sf span,
.wf-table th, .wf-table td, .wf-thead, .wf-pg, .wf-ql span, .wf-links span, .wf-stat span, .wf-mega span, .wf-mega b,
.wf-side nav span, .wf-footer span, .wf-utilbar span, .wf-hsearch, .wf-dtable th, .wf-gh b, .wf-meta, .wf-card b, .wf-files span { white-space: nowrap; }
.wf-notice li span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.wf * { box-sizing: border-box; }
.wf button { font: inherit; }

f":"FN-PUB-900","message":"기능 FN-PUB-900 통합 검색: 연결된 요구사항이 없습니다"},{"kind":"SCREEN","ref":"PUB_MAIN_HOME_010","message":"화면 PUB_MAIN_HOME_010 메인: 연결된 요구사항이 없습니다"}]},"snapshots":[],"diff":null,"chunks":[{"id":"SRC-001#1","sourceId":"SRC-001","locator":"정보공개 통합 서비스 구축 사업 제안요청서(요약)","text":"정보공개 통합 서비스 구축 사업 제안요청서(요약)\n\n> 샘플 자료입니다. 실제 사업 문서가 아닙니다."},{"id":"SRC-001#2","sourceId":"SRC-001","locator":"1. 사업 개요","text":"1. 사업 개요\n기관이 보유한 행정 자료를 국민이 쉽게 찾아볼 수 있도록 정보공개 통합 서비스를 구축한다. 민원인은 민원포털에서 자료를 등록하고 공개를 신청하며, 심사자는 심사자 시스템에서 내용을 검토해 승인하거나 반려한다. 승인된 자료는 대국민 포털에 공개되고 국가 정보공개 포털로 연계된다."},{"id":"SRC-001#3","sourceId":"SRC-001","locator":"2. 사업 범위","text":"2. 사업 범위\n- 대국민 포털: 정보공개 목록·상세 조회, 통합 검색\n- 민원포털: 회원가입·로그인, 자료 등록 및 공개 신청, 처리 현황 조회, 보완 후 재신청\n- 심사자·관리자 시스템: 신청 목록, 심사(승인·반려), 심사 이력 관리\n- 외부 연계: 국가 정보공개 포털 전송"},{"id":"SRC-001#4","sourceId":"SRC-001","locator":"3. 기능 요구사항","text":"3. 기능 요구사항"},{"id":"SRC-001#5","sourceId":"SRC-001","locator":"SFR-001 민원인 회원가입 및 로그인","text":"SFR-001 민원인 회원가입 및 로그인\n민원인은 본인인증을 거쳐 회원가입하고 아이디·비밀번호 또는 간편인증으로 로그인한다. 비밀번호는 9자 이상, 영문·숫자·특수문자를 모두 포함해야 한다."},{"id":"SRC-001#6","sourceId":"SRC-001","locator":"SFR-002 대국민 정보공개","text":"SFR-002 대국민 정보공개\n민원인이 등록한 자료를 심사자가 검토·승인하면 대국민 포털에 공개한다. 반려된 자료는 민원인이 사유를 확인하고 보완 후 재신청할 수 있어야 한다. 공개 구분은 전체공개와 부분공개로 나누며, 부분공개일 때는 비공개 사유를 입력한다."},{"id":"SRC-001#7","sourceId":"SRC-001","locator":"SFR-003 심사 이력 관리","text":"SFR-003 심사 이력 관리\n심사자는 자료별 심사 이력(검토·승인·반려 일시, 처리자, 사유)을 시간 순으로 확인할 수 있어야 한다."},{"id":"SRC-001#8","sourceId":"SRC-001","locator":"SFR-004 처리 결과 모바일 알림","text":"SFR-004 처리 결과 모바일 알림\n심사 결과가 확정되면 민원인에게 모바일 알림을 보낸다."},{"id":"SRC-001#9","sourceId":"SRC-001","locator":"SFR-005 타 기관 자료 일괄 수집","text":"SFR-005 타 기관 자료 일괄 수집\n타 기관 공개 자료를 일괄 수집해 함께 제공한다."},{"id":"SRC-001#10","sourceId":"SRC-001","locator":"SFR-006 정보공개 청구 신청","text":"SFR-006 정보공개 청구 신청\n민원인이 정보공개 청구서를 작성해 신청하면 담당 심사자가 검토 후 공개 여부를 승인 또는 반려로 결정하고, 결과를 문자로 알린다. 공개 결정된 자료는 국가 정보공개 포털로 연계 전송한다."},{"id":"SRC-001#11","sourceId":"SRC-001","locator":"4. 화면·접근성 요구사항","text":"4. 화면·접근성 요구사항\n- 대국민 포털은 범정부 UI/UX 가이드라인(KRDS)의 구성 원칙을 따르고 한국형 웹 콘텐츠 접근성 지침 2.2를 준수한다.\n- 목록 화면은 검색 조건, 총 건수, 페이지 번호를 제공한다.\n- 심사자 시스템은 하루 종일 쓰는 업무 화면이므로 한 화면에 많은 목록을 볼 수 있게 한다."},{"id":"SRC-002#1","sourceId":"SRC-002","locator":"문단 1","text":"정보공개 통합 서비스 구축 착수보고 회의록 (샘플)"},{"id":"SRC-002#2","sourceId":"SRC-002","locator":"문단 2","text":"일시: 2026년 9월 18일 14:00\n참석: 발주기관 정보공개팀, 수행사 기획·설계 담당"},{"id":"SRC-002#3","sourceId":"SRC-002","locator":"문단 3","text":"1. 사업 범위 확인\nSFR-005 타 기관 자료 일괄 수집은 기관 간 협약이 필요하므로 2차 사업 범위로 이관하기로 결정함."},{"id":"SRC-002#4","sourceId":"SRC-002","locator":"문단 4","text":"2. 심사 절차\n심사자는 신청 건을 검토한 뒤 승인 또는 반려한다. 반려 시 사유 입력은 필수이며 100자 이상 작성하도록 한다. 반려된 건은 민원인이 보완 후 재신청할 수 있고, 재신청 건은 목록에서 구분되어야 한다."},{"id":"SRC-002#5","sourceId":"SRC-002","locator":"문단 5","text":"3. 공개 기준\n부분공개는 개인정보가 포함된 경우에만 선택할 수 있다. 공개일은 승인일 다음 날로 한다."},{"id":"SRC-002#6","sourceId":"SRC-002","locator":"문단 6","text":"4. 디자인 방향\n대국민 포털은 정부 표준형 구성을 우선 검토한다. 심사자 시스템은 좌측 메뉴 업무형을 선호하며 목록은 한 화면에 50건까지 볼 수 있어야 한다."},{"id":"SRC-002#7","sourceId":"SRC-002","locator":"문단 7","text":"5. 후속 조치\n수행사는 시스템별 Task 분해 결과와 요구사항 추적표를 다음 주까지 공유한다."}],"prompts":{"sb:PUB_INF_LST_010":{"title":"화면설계서 PUB_INF_LST_010 정보공개 목록","figma":"# 요청: Figma에 화면설계서 그리기 — PUB_INF_LST_010 정보공개 목록\nFigma MCP 도구(use_figma 등)로 아래 화면을 Figma에 그려 주세요. 설명 없이 바로 작업하고, 끝나면 만든 프레임 링크와 요약을 알려 주세요.\n\n## 대상\n- 프로젝트: 정보공개 통합 서비스 구축 (PUBINFO, 작업 버전 v0.1, 신규 구축, 제출 양식 공공기관 제출용)\n- 시스템: PUB 대국민 포털 (주 사용자: 일반 국민(비회원 포함))\n- 화면: PUB_INF_LST_010 정보공개 목록 · 페이지 · 템플릿 list · Location: 정보공개 > 정보공개 목록\n- 요구사항·Task: SFR-002 대국민 정보공개 / SFR-002-T05 [PUB] 국민: 공개 목록·상세 조회 (설계완료)\n\n## 참조 URL\n- 공유 뷰어(현재 설계): https://claude.ai/artifact/X2QfnDTukesLPa4jD3XKLv#PUBINFO\n- 참고 · 범정부 UI/UX 디자인 시스템(KRDS): https://www.krds.go.kr\n- Figma 파일이 등록되지 않았습니다. 새 파일을 만들고 링크를 알려 주세요.\n\n## 캔버스 규격 (줄바꿈 금지)\n- 프레임: 1920×1080 데스크톱 뷰포트 기준. 내용이 길면 높이만 늘린다(폭은 1920 고정).\n- 프레임 이름: `PUB_INF_LST_010 정보공개 목록`. 페이지 이름: `PUB 대국민 포털`\n- 메뉴·버튼·뱃지·표 머리글·라벨 텍스트는 Auto width(한 줄)로 두어 줄바꿈이 생기지 않게 한다. 본문 설명만 고정 폭 줄바꿈 허용.\n- 레이아웃은 Auto layout으로 만들고, 헤더·본문·푸터를 각각 그룹으로 나눈다.\n\n## 디자인 시스템 (PUB)\n- 컨셉: A. 정부 표준형 — 상단 메가메뉴, 왼쪽 로고, 표 목록과 번호 페이지네이션. 범정부 UI/UX 가이드라인(KRDS)의 구성 원칙을 따른다.\n- 색상: 주 색 #1B5FC1, 주 색 위 글자 #FFFFFF, 강조 #0B7A75, 메뉴 배경 #FFFFFF, 메뉴 글자 #1E2124, 배경 #F4F6F9, 면 #FFFFFF, 보조 면 #EEF2F7, 선 #D5DBE3, 글자 #1E2124, 보조 글자 #6B7280, 성공 #1E7B4B, 주의 #B45309, 오류 #C0262D, 안내 #1D6FB8\n- 글꼴: Noto Sans KR · 크기(px) 메인 비주얼 38 / 화면 제목 30 / 구역 제목 23 / 소제목 19 / 본문 16 / 보조 15 / 캡션 14 · 굵게 700\n- 모서리 2/4/8px · 입력·버튼 높이 44px · 목록 행 높이 52px · 기본 간격 8px · 그림자 none\n- 그리드: 12단, 콘텐츠 최대 폭 1200px, 단 간격 24px\n- 레이아웃 규칙: GNB 위치 상단 메가메뉴, 로고 위치 왼쪽, 검색 영역 헤더 안, 목록 형태 표(그리드), 페이지네이션 번호, 버튼 모서리 각진, 밀도 여유, 푸터 기관 정보 전체\n- 위 값은 Figma 변수(색·숫자)와 텍스트 스타일로 먼저 등록하고, 화면에서는 변수만 사용한다.\n\n## 사용 컴포넌트 (디자인 시스템에 있는 것만 사용)\n- `search-panel` 검색 조건 영역 — 목록 위 조건(기간·구분·상태·키워드)과 조회·초기화 버튼\n- `data-table` 목록 표(그리드) (변형: table, card) — 총 건수, 정렬, 행 클릭 이동, 상태 뱃지 열\n- `pagination` 페이지네이션 (변형: numbered, numbered-size, more) — 처음·이전·번호·다음·마지막, 목록 개수 선택\n\n## 화면 구성 (위에서 아래 순서, 번호 = 설명 번호)\n1. 검색 조건 — 컴포넌트 `search-panel`\n   - 속성: {\"fields\":[{\"label\":\"공개일\",\"type\":\"date-range\"},{\"label\":\"공개 구분\",\"type\":\"select\",\"options\":[\"전체\",\"전체공개\",\"부분공개\"]},{\"label\":\"검색어\",\"type\":\"text\",\"placeholder\":\"제목·기관명\"}]}\n   - 기획자 관점: 기간 기본값은 최근 1년. 초기화 시 기본값으로 되돌림\n   - 고객 관점: 기간·공개 구분·검색어로 자료를 좁혀 찾는다\n   - 옵션: 전체 / 전체공개 / 부분공개 (기본값 전체) · 공개 구분\n2. 공개 자료 목록 — 컴포넌트 `data-table` → 이동: PUB_INF_DTL_010\n   - 속성: {\"total\":128,\"columns\":[\"번호\",\"제목\",\"기관\",\"공개 구분\",\"공개일\"],\"badgeColumn\":3,\"rows\":[[\"128\",\"2026년 하반기 지역 도로 정비 계획\",\"도로과\",\"전체공개\",\"2026-09-24\"],[\"127\",\"공공 체육시설 이용 현황(8월)\",\"체육진흥과\",\"전체공개\",\"2026-09-22\"],[\"126\",\"민원 처리 결과 통계\",\"민원봉사과\",\"부분공개\",\"2026-09-19\"],[\"125\",\"하천 수질 측정 결과\",\"환경과\",\"전체공개\",\"2026-09-18\"]]}\n   - 기획자 관점: 공개일 최신순. 공개중지 자료는 노출하지 않음. 제목 클릭 시 상세로 이동\n   - 고객 관점: 공개된 자료를 표로 훑어보고 제목을 눌러 상세를 연다\n3. 페이지 번호 — 컴포넌트 `pagination`\ 공통 상태값 사용)\n- `file-list` 첨부파일 목록 — 파일명·용량·내려받기\n- `stat-cards` 요약 수치 카드 — 대시보드 건수 요약\n- `notice-list` 게시물 요약 목록 — 공지·새소식 최근 N건\n- `empty-state` 빈 화면 안내 — 데이터가 없을 때 안내 문구\n- `hero-banner` 메인 비주얼 — 메인 상단 대표 문구·검색\n- `quick-links` 바로가기 — 자주 쓰는 서비스 아이콘 링크\n- `login-form` 로그인 폼 — 아이디·비밀번호, 간편인증, 찾기 링크\n- `text-input` 입력창 (변형: default, error, disabled) — 라벨, 필수 표시, 안내·오류 문구\n- `textarea` 여러 줄 입력 — 글자 수 표시\n- `select` 선택 목록 — 옵션 목록, 기본값\n- `radio-group` 라디오 버튼 — 하나만 선택\n- `checkbox-group` 체크박스 — 여러 개 선택, 약관 동의\n- `date-range` 기간 선택 — 시작일~종료일, 빠른 기간 버튼\n- `file-upload` 파일 첨부 — 허용 형식·용량 안내, 첨부 목록\n- `button` 버튼 (변형: primary, secondary, tertiary, danger) — 주요·보조·텍스트 버튼\n- `button-group` 버튼 영역 — 화면 하단 주요 동작 버튼 묶음\n- `confirm-dialog` 확인 창(컨펌) — 되돌릴 수 없는 동작 전 확인. 확인·취소\n- `alert-dialog` 알림 창(얼럿) — 결과·오류 안내. 확인 버튼 하나\n- `toast` 토스트 (변형: success, info, danger) — 잠시 나타났다 사라지는 처리 결과 알림\n- `modal` 모달 팝업 — 화면 위 레이어 팝업. 제목·본문·닫기\n\n## 현재 화면설계서\n1. 검색 조건 — 컴포넌트 `search-panel`\n   - 속성: {\"fields\":[{\"label\":\"공개일\",\"type\":\"date-range\"},{\"label\":\"공개 구분\",\"type\":\"select\",\"options\":[\"전체\",\"전체공개\",\"부분공개\"]},{\"label\":\"검색어\",\"type\":\"text\",\"placeholder\":\"제목·기관명\"}]}\n   - 기획자 관점: 기간 기본값은 최근 1년. 초기화 시 기본값으로 되돌림\n   - 고객 관점: 기간·공개 구분·검색어로 자료를 좁혀 찾는다\n   - 옵션: 전체 / 전체공개 / 부분공개 (기본값 전체) · 공개 구분\n2. 공개 자료 목록 — 컴포넌트 `data-table` → 이동: PUB_INF_DTL_010\n   - 속성: {\"total\":128,\"columns\":[\"번호\",\"제목\",\"기관\",\"공개 구분\",\"공개일\"],\"badgeColumn\":3,\"rows\":[[\"128\",\"2026년 하반기 지역 도로 정비 계획\",\"도로과\",\"전체공개\",\"2026-09-24\"],[\"127\",\"공공 체육시설 이용 현황(8월)\",\"체육진흥과\",\"전체공개\",\"2026-09-22\"],[\"126\",\"민원 처리 결과 통계\",\"민원봉사과\",\"부분공개\",\"2026-09-19\"],[\"125\",\"하천 수질 측정 결과\",\"환경과\",\"전체공개\",\"2026-09-18\"]]}\n   - 기획자 관점: 공개일 최신순. 공개중지 자료는 노출하지 않음. 제목 클릭 시 상세로 이동\n   - 고객 관점: 공개된 자료를 표로 훑어보고 제목을 눌러 상세를 연다\n3. 페이지 번호 — 컴포넌트 `pagination`\n   - 속성: {\"total\":128}\n   - 기획자 관점: 한 페이지 10건\n   - 고객 관점: 다음 페이지로 이동한다\n\n## 검토 기준\n1. 요구사항·Task의 동작이 화면에 모두 있는가 (빠진 요소, 빠진 상태: 빈 목록·오류·권 n- `button-group` 버튼 영역 — 화면 하단 주요 동작 버튼 묶음\n- `confirm-dialog` 확인 창(컨펌) — 되돌릴 수 없는 동작 전 확인. 확인·취소\n- `alert-dialog` 알림 창(얼럿) — 결과·오류 안내. 확인 버튼 하나\n- `toast` 토스트 (변형: success, info, danger) — 잠시 나타났다 사라지는 처리 결과 알림\n- `modal` 모달 팝업 — 화면 위 레이어 팝업. 제목·본문·닫기\n\n## 현재 화면설계서\n1. 자료 정보 — 컴포넌트 `detail-table`\n   - 속성: {\"rows\":[[\"제목\",\"2026년 하반기 지역 도로 정비 계획\"],[\"기관\",\"도로과\"],[\"공개 구분\",\"전체공개\"],[\"공개일\",\"2026-09-24\"],[\"내용\",\"하반기 도로 정비 대상 구간과 일정을 공개합니다.\"]]}\n   - 기획자 관점: 부분공개 자료는 비공개 사유를 함께 표시\n   - 고객 관점: 자료의 기관·공개일·공개 구분을 확인한다\n2. 첨부파일 — 컴포넌트 `file-list`\n   - 속성: {\"files\":[\"도로정비계획_2026하반기.pdf (2.1MB)\"]}\n   - 기획자 관점: PDF·HWP만 첨부\n   - 고객 관점: 첨부 문서를 내려받는다\n3. 목록 버튼 — 컴포넌트 `button-group` → 이동: PUB_INF_LST_010\n   - 속성: {\"buttons\":[{\"label\":\"목록\",\"variant\":\"secondary\"}]}\n   - 기획자 관점: 이전 검색 조건 유지\n   - 고객 관점: 목록으로 돌아간다\n\n## 검토 기준\n1. 요구사항·Task의 동작이 화면에 모두 있는가 (빠진 요소, 빠진 상태: 빈 목록·오류·권한 없음)\n2. 설명은 기획자 관점(정책·노출 조건·규칙·예외)과 고객 관점(보이는 것·할 수 있는 것·안내 문구)으로만 썼는가. 개발자 관점은 빼기\n3. 선택 요소(셀렉트·라디오·체크·탭·필터·정렬)에 옵션 전체와 기본값이 있는가\n4. 입력 요소마다 필수 여부, 길이·형식, 검증 시점, 오류 문구가 있는가\n5. 참조자료(회의록 결정 등)와 어긋나는 내용이 없는가\n\n## 출력 형식\n1) 검토 결과 표: 번호 | 문제 | 근거(요구사항·자료 위치) | 수정안\n2) 완성본 JSON: 아래 형식의 `components` 배열 하나 (planning 도구에 그대로 넣습니다)\n```json\n{ \"screenId\": \"PUB_INF_DTL_010\", \"components\": [ { \"no\": 1, \"label\": \"\", \"kind\": \"\", \"planner\": \"\", \"customer\": \"\", \"options\": { \"values\": [], \"default\": \"\" }, \"validation\": { \"required\": true, \"minLength\": 0, \"maxLength\": 0, \"timing\": [\"ON_SUBMIT\"], \"messages\": [{ \"condition\": \"\", \"text\": \"\" }] }, \"ui\": { \"component\": \"디자인 시스템 컴포넌트 ID\", \"props\": {}, \"link\": \"이동 화면 ID\" } } ] }\n```\n- 디자인 시스템에 없는 컴포넌트가 필요하면 JSON에 넣지 말고 ‘추가 필요 컴포넌트’로 따로 적어 주세요.\n","urls":[{"label":"공유 뷰어(현재 설계)","url":"https://claude.ai/artifact/X2QfnDTukesLPa4jD3XKLv#PUBINFO"},{"label":"참고 · 범정부 UI/UX 디자인 시스템(KRDS)","url":"https://www.krds.go.kr"}],"evidence":4},"sb:CVL_INF_REG_010":{"title":"화면설계서 CVL_INF_REG_010 정보공개 자료 등록","figma":"# 요청: Figma에 화면설계서 그리기 — CVL_INF_REG_010 정보공개 자료 등록\nFigma MCP 도구(use_figma 등)로 아래 화면을 Figma에 그려 주세요. 설명 없이 바로 작업하고, 끝나면 만든 프레임 링크와 요약을 알려 주세요.\n\n## 대상\n- 프로젝트: 정보공개 통합 서비스 구축 (PUBINFO, 작업 버전 v0.1, 신규 구축, 제출 양식 공공기관 제출용)\n- 시스템: CVL 민원포털 (주 사용자: 민원인(회원))\n- 화면: CVL_INF_REG_010 정보공개 자료 등록 · 페이지 · 템플릿 form · Location: 정보공개 > 정보공개 자료 등록\n- 요구사항·Task: SFR-002 대국민 정보공개 / SFR-002-T01 [CVL] 민원인: 자료 등록 및 공개 신청 (검토완료)\n\n## 참조 URL\n- 공유 뷰어(현재 설계): https://claude.ai/artifact/X2QfnDTukesLPa4jD3XKLv#PUBINFO\n- 참고 · 범정부 UI/UX 디자인 시스템(KRDS): https://www.krds.go.kr\n- Figma 파일이 등록되지 않았습니다. 새 파일을 만들고 링크를 알려 주세요.\n\n## 캔버스 규격 (줄바꿈 금지)\n- 프레임: 1920×1080 데스크톱 뷰포트 기준. 내용이 길면 높이만 늘린다(폭은 1920 고정).\n- 프레임 이름: `CVL_INF_REG_010 정보공개 자료 등록`. 페이지 이름: `CVL 민원포털`\n- 메뉴·버튼·뱃지·표 머리글·라벨 텍스트는 Auto width(한 줄)로 두어 줄바꿈이 생기지 않게 한다. 본문 설명만 고정 폭 줄바꿈 허용.\n- 레이아웃은 Auto layout으로 만들고, 헤더·본문·푸터를 각각 그룹으로 나눈다.\n\n## 디자인 시스템 (CVL)\n- 컨셉: A. 단계 안내 신청형 — 신청 단계 표시와 넓은 입력 폼, 상단 메뉴. 처음 신청하는 민원인이 막히지 않게 한 단계씩 안내\n- 색상: 주 색 #1E6B52, 주 색 위 글자 #FFFFFF, 강조 #1B5FC1, 메뉴 배경 #FFFFFF, 메뉴 글자 #1B2420, 배경 #F4F7F5, 면 #FFFFFF, 보조 면 #E9F1EC, 선 #D1DDD5, 글자 #1B2420, 보조 글자 #6B7280, 성공 #1E7B4B, 주의 #B45309, 오류 #C0262D, 안내 #1D6FB8\n- 글꼴: Noto Sans KR · 크기(px) 메인 비주얼 38 / 화면 제목 30 / 구역 제목 23 / 소제목 19 / 본문 16 / 보조 15 / 캡션 14 · 굵게 700\n- 모서리 4/6/12px · 입력·버튼 높이 46px · 목록 행 높이 54px · 기본 간격 8px · 그림자 soft\n- 그리드: 12단, 콘텐츠 최대 폭 1080px, 단 간격 24px\n- 레이아웃 규칙: GNB 위치 상단, 로고 위치 왼쪽, 검색 영역 헤더 안, 목록 형태 표(그리드), 페이지네이션 번호, 버튼 모서리 둥근, 밀도 여유, 푸터 간단\n- 위 값은 Figma 변수(색·숫자)와 텍스트 스타일로 먼저 등록하고, 화면에서는 변수만 사용한다.\n\n## 사용 컴포넌트 (디자인 시스템에 있는 것만 사용)\n- `step-indicator` 단계 표시 — 신청 절차의 현재 단계\n- `text-input` 입력창 (변형: default, error, disabled) — 라벨, 필수 표시, 안내·오류 문구\n- `textarea` 여러 줄 입력 — 글자 수 표시\n- `radio-group` 라디오 버튼 — 하나만 선택\n- `file-upload` 파일 첨부 — 허용 형식·용량 안내, 첨부 목록\n- `button-group` 버튼 영역 — 화면 하단 주요 동작 버튼 묶음\n\n## 화면 구성 (위에서 아래 순서, 번호 = 설명 번호)\n1. 신청 단계 — 컴포넌트 `step-indicator`\n   - 속성: {\"steps\":[\"자료 입력\",\"내용 확인\",\"신청 완료\"],\"current\":0}\n   - 기획자 관점: 3단계 중 1단계\n   - 고객 관점: 지금 몇 번째 단계인지 본다\n2. 제목 — 컴포넌트 `text-input`\n   - 속성: {\"label\":\"제목\",\"placeholder\":\"자료 제목을 입력하세요\",\"required\":true}\n   - 기획자 관점: 공개 목록에 그대로 노출되는 제목. 저장 시 앞뒤 공백 제거\n   - 고객 관점: 등록할 자료의 제목을 입력한다\n   - 유효성: 필수 · 2~100자 · 검증 시점 입력칸을 벗어날 때, 제출 시\n   - 오류 문구(미입력): “제목을 입력해 주세요.”\n   - 오류 문구(100자 초과): “제목은 100자 이내로 입력해 주세요.”\n3. 공개 구분 — 컴포넌트 `radio-group`\n   - 속성: {\"label\":\"공개 구분\",\"options\":[\"전체공개\",\"부분공개\"],\"value\":\"전체공개\",\"required\":true}\n   - 기획자 관점: 부분공개는 개인정보가 포함된 경우에만 선택. 선택 시 비공개 사유 입력란 노출\n   - 고객 관점: 자료를 어느 범위까지 공개할지 선택한다\n   - 옵션: 전체공개 / 부분공개 (기본값 전체공개)\n   - 유효성: 필수 · 검증 시점 제출 시\n4. 내용 — 컴포넌트 `textarea`\n   - 속성: {\"label\":\"내용\",\"placeholder\":\"자료 내용을 입력하세요 (2,000자 이내)\",\"required\":true}\n   - 기획자 관점: 최대 2,000자\n   - 고객 관점: 자료 내용을 요약해 적는다\n   - 유효성: 필수 · 0~2000자 · 검증 시점 제출 시\n   - 오류 문구(미입력): “내용을 입력해 주세요.”\n5. 첨부파일 — 컴포넌트 `file-upload`\n   - 속성: {\"label\":\"첨부파일\",\"hint\":\"PDF·HWP·HWPX, 파일당 20MB, 최대 5개\"}\n   - 기획자 관점: PDF·HWP·HWPX, 파일당 20MB, 최대 5개\n   - 고객 관점: 공개할 원문 파일을 올린다\n   - 유효성: 선택 · 검증 시점 입력 중\n   - 오류 문구(형식 오류): “PDF, HWP, HWPX 파일만 올릴 수 있습니다.”\n6. 하단 버튼 — 컴포넌트 `button-group` → 이동: CVL_INF_STS_010\n   - 속성: {\"buttons\":[{\"label\":\"임시저장\",\"variant\":\"secondary\",\"action\":\"toast\",\"message\":\"임시저장했습니다.\"},{\"label\":\"공개 신청\",\"variant\":\"primary\",\"action\":\"submit\",\"confirm\":\"입력한 내용으로 공개를 신청할까요?\",\"message\":\"공개 신청을 접수했습니다.\"}]}\n   - 기획자 관점: 공개 신청 시 확인 창 → 신청 완료 후 처리 현황으로 이동\n   - 고객 관점: 임시저장하거나 공개를 신청한다\n\n## 화면설계서 표기\n- 각 요소 왼쪽 위에 번호 마커(빨간 원 #E5484D, 지름 22, 흰 숫자)를 둔다.\n- 프레임 오른쪽에 설명 패널(폭 560)을 붙인다: 머리글(화면 ID CVL_INF_REG_010 · 화면명 · 시스템 · Location), 번호별 [기획] [고객] 설명, 옵션, 유효성·오류 문구.\n- 개발자 관점 설명(API, DB, 구현 방법)은 넣지 않는다.\n- 공공기관 제출 양식: 한 장(16:9)에 설명이 넘치면 같은 화면 ID로 다음 장을 만들고, 앞 장 아래에 “다음 페이지에 계속 ▶”, 다음 장 위에 “◀ 이전 페이지에서 계속”, 머리글에 (1/2) 표시.\n\n## 참조자료 근거\n- [SRC-001 제안요청서(요약) · 2. 사업 범위] 2. 사업 범위 - 대국민 포털: 정보공개 목록·상세 조회, 통합 검색 - 민원포털: 회원가입·로그인, 자료 등록 및 공개 신청, 처리 현황 조회, 보완 후 재신청 - 심사자·관리자 시스템: 신청 목록, 심사(승인·반려), 심사 이력 관리 - 외부 연계: 국가 정보공개 포털 전송\n- [SRC-001 제안요청서(요약) · 1. 사업 개요] 1. 사업 개요 기관이 보유한 행정 자료를 국민이 쉽게 찾아볼 수 있도록 정보공개 통합 서비스를 구축한다. 민원인은 민원포털에서 자료를 등록하고 공개를 신청하며, 심사자는 심사자 시스템에서 내용을 검토해 승인하거나 반려한다. 승인된 자료는 대국민 포털에 공개되고 국가 정보공개 포털로 연계된다.\n- [SRC-001 제안요청서(요약) · SFR-002 대국민 정보공개] SFR-002 대국민 정보공개 민원인이 등록한 자료를 심사자가 검토·승인하면 대국민 포털에 공개한다. 반려된 자료는 민원인이 사유를 확인하고 보완 후 재신청할 수 있어야 한다. 공개 구분은 전체공개와 부분공개로 나누며, 부분공개일 때는 비공개 사유를 입력한다.\n- [SRC-001 제안요청서(요약) · SFR-006 정보공개 청구 신청] SFR-006 정보공개 청구 신청 민원인이 정보공개 청구서를 작성해 신청하면 담당 심사자가 검토 후 공개 여부를 승인 또는 반려로 결정하고, 결과를 문자로 알린다. 공개 결정된 자료는 국가 정보공개 포털로 연계 전송한다.\n\n## 지켜 주세요\n- 디자인 시스템에 없는 컴포넌트가 필요하면 새로 그리지 말고 목록으로 알려 주세요(디자인 시스템에 먼저 추가합니다).\n- 문구는 위 내용을 그대로 쓰고, 없는 내용은 지어내지 말고 ‘확인 필요’로 표시해 주세요.\n","claude":"# 요청: 화면설계서 검토·보완 — CVL_INF_REG_010 정보공개 자료 등록\n아래 화면설계서를 요구사항과 참조자료 근거에 비추어 검토하고, 빠진 항목을 채운 완성본을 돌려주세요.\n\n## 대상\n- 프로젝트: 정보공개 통합 서비스 구축 (PUBINFO, 작업 버전 v0.1, 신규 구축, 제출 양식 공공기관 제출용)\n- 시스템: CVL 민원포털 (주 사용자: 민원인(회원))\n- 화면: CVL_INF_REG_010 정보공개 자료 등록 · 페이지 · 템플릿 form · Location: 정보공개 > 정보공개 자료 등록\n- 요구사항·Task: SFR-002 대국민 정보공개 / SFR-002-T01 [CVL] 민원인: 자료 등록 및 공개 신청 (검토완료)\n\n## 참조 URL\n- 공유 뷰어(현재 설계): https://claude.ai/artifact/X2QfnDTukesLPa4jD3XKLv#PUBINFO\n- 참고 · 범정부 UI/UX 디자인 시스템(KRDS): https://www.krds.go.kr\n\n## 요구사항 원문\n- SFR-002 대국민 정보공개: 민원인이 등록한 자료를 심사자가 검토·승인하면 대국민 포털에 공개한다.\n\n## 참조자료 근거\n- [SRC-001 제안요청서(요약) · 2. 사업 범위] 2. 사업 범위 - 대국민 포털: 정보공개 목록·상세 조회, 통합 검색 - 민원포털: 회원가입·로그인, 자료 등록 및 공개 신청, 처리 현황 조회, 보완 후 재신청 - 심사자·관리자 시스템: 신청 목록, 심사(승인·반려), 심사 이력 관리 - 외부 연계: 국가 정보공개 포털 전송\n- [SRC-001 제안요청서(요약) · 1. 사업 개요] 1. 사업 개요 기관이 보유한 행정 자료를 국민이 쉽게 찾아볼 수 있도록 정보공개 통합 서비스를 구축한다. 민원인은 민원포털에서 자료를 등록하고 공개를 신청하며, 심사자는 심사자 시스템에서 내용을 검토해 승인하거나 반려한다. 승인된 자료는 대국민 포털에 공개되고 국가 정보공개 포털로 연계된다.\n- [SRC-001 제안요청서(요약) · SFR-002 대국민 정보공개] SFR-002 대국민 정보공개 민원인이 등록한 자료를 심사자가 검토·승인하면 대국민 포털에 공개한다. 반려된 자료는 민원인이 사유를 확인하고 보완 후 재신청할 수 있어야 한다. 공개 구분은 전체공개와 부분공개로 나누며, 부분공개일 때는 비공개 사유를 입력한다.\n- [SRC-001 제안요청서(요약) · SFR-006 정보공개 청구 신청] SFR-006 정보공개 청구 신청 민원인이 정보공개 청구서를 작성해 신청하면 담당 심사자가 검토 후 공개 여부를 승인 또는 반려로 결정하고, 결과를 문자로 알린다. 공개 결정된 자료는 국가 정보공개 포털로 연계 전송한다.\n\n## 디자인 시스템 (CVL)\n- 컨셉: A. 단계 안내 신청형 — 신청 단계 표시와 넓은 입력 폼, 상단 메뉴. 처음 신청하는 민원인이 막히지 않게 한 단계씩 안내\n- 색상: 주 색 #1E6B52, 주 색 위 글자 #FFFFFF, 강조 #1B5FC1, 메뉴 배경 #FFFFFF, 메뉴 글자 #1B2420, 배경 #F4F7F5, 면 #FFFFFF, 보조 면 #E9F1EC, 선 #D1DDD5, 글자 #1B2420, 보조 글자 #6B7280, 성공 #1E7B4B, 주의 #B45309, 오류 #C0262D, 안내 #1D6FB8\n- 글꼴: Noto Sans KR · 크기(px) 메인 비주얼 38 / 화면 제목 30 / 구역 제목 23 / 소제목 19 / 본문 16 / 보조 15 / 캡션 14 · 굵게 700\n- 모서리 4/6/12px · 입력·버튼 높이 46px · 목록 행 높이 54px · 기본 간격 8px · 그림자 soft\n- 그리드: 12단, 콘텐츠 최대 폭 1080px, 단 간격 24px\n- 레이아웃 규칙: GNB 위치 상단, 로고 위치 왼쪽, 검색 영역 헤더 안, 목록 형태 표(그리드), 페이지네이션 번호, 버튼 모서리 둥근, 밀도 여유, 푸터 간단\n\n## 쓸 수 있는 컴포넌트\n- `gnb` GNB (주 메뉴) (변형: top, top-mega, side) — 로고, 1depth 메뉴, 유틸리티(로그인·마이페이지). 레이아웃 규칙에 따라 상단 또는 좌측\n- `lnb` LNB (하위 메뉴) — 2depth 이하 메뉴. 상단 GNB형에서 하위 페이지 좌측에 표시\n- `breadcrumb` 현재 위치(Location) — 홈 > 1depth > 2depth\n- `tabs` 탭 (변형: line, box) — 같은 화면 안 내용 전환\n- `step-indicator` 단계 표시 — 신청 절차의 현재 단계\n- `footer` 푸터 (변형: full, simple) — 기관 정보, 개인정보처리방침, 저작권\n- `search-bar` 검색창 (변형: header, hero, inline) — 키워드 입력 + 검색 버튼\n- `search-panel` 검색 조건 영역 — 목록 위 조건(기간·구분·상태·키워드)과 조회·초기화 버튼\n- `data-table` 목록 표(그리드) (변형: table, card) — 총 건수, 정렬, 행 클릭 이동, 상태 뱃지 열\n- `card-list` 카드 목록 — 썸네일·제목·요약·메타 정보 카드\n- `pagination` 페이지네이션 (변형: numbered, numbered-size, more) — 처음·이전·번호·다음·마지막, 목록 개수 선택\n- `detail-table` 상세 정보 표 — 항목명-값 2열 표\n- `status-badge` 상태 뱃지 (변형: neutral, info, success, warning, danger) — 처리 상태 표시 (공통 상태값 사용)\n- `file-list` 첨부파일 목록 — 파일명·용량·내려받기\n- `stat-cards` 요약 수치 카드 — 대시보드 건수 요약\n- `notice-list` 게시물 요약 목록 — 공지·새소식 최근 N건\n- `empty-state` 빈 화면 안내 — 데이터가 없을 때 안내 문구\n- `hero-banner` 메인 비주얼 — 메인 상단 대표 문구·검색\n- `quick-links` 바로가기 — 자주 쓰는 서비스 아이콘 링크\n- `login-form` 로그인 폼 — 아이디·비밀번호, 간편인증, 찾기 링크\n- `text-input` 입력창 (변형: default, error, disabled) — 라벨, 필수 표시, 안내·오류 문구\n- `textarea` 여러 줄 입력 — 글자 수 표시\n- `select` 선택 목록 — 옵션 목록, 기본값\n- `radio-group` 라디오 버튼 — 하나만 선택\n- `checkbox-group` 체크박스 — 여러 개 선택, 약관 동의\n- `date-range` 기간 선택 — 시작일~종료일, 빠른 기간 버튼\n- `file-upload` 파일 첨부 — 허용 형식·용량 안내, 첨부 목록\n- `button` 버튼 (변형: primary, secondary, tertiary, danger) — 주요·보조·텍스트 버튼\n- `button-group` 버튼 영역 — 화면 하단 주요 동작 버튼 묶음\n- `confirm-dialog` 확인 창(컨펌) — 되돌릴 수 없는 동작 전 확인. 확인·취소\n- `alert-dialog` 알림 창(얼럿) — 결과·오류 안내. 확인 버튼 하나\n- `toast` 토스트 (변형: success, info, danger) — 잠시 나타났다 사라지는 처리 결과 알림\n- `modal` 모달 팝업 — 화면 위 레이어 팝업. 제목·본문·닫기\n\n## 현재 화면설계서\n1. 신청 단계 — 컴포넌트 `step-indicator`\n   - 속성: {\"steps\":[\"자료 입력\",\"내용 확인\",\"신청 완료\"],\"current\":0}\n   - 기획자 관점: 3단계 중 1단계\n   - 고객 관점: 지금 몇 번째 단계인지 본다\n2. 제목 — 컴포넌트 `text-input`\n   - 속성: {\"label\":\"제목\",\"placeholder\":\"자료 제목을 입력하세요\",\"required\":true}\n   - 기획자 관점: 공개 목록에 그대로 노출되는 제목. 저장 시 앞뒤 공백 제거\n   - 고객 관점: 등록할 자료의 제목을 입력한다\n   - 유효성: 필수 · 2~100자 · 검증 시점 입력칸을 벗어날 때, 제출 시\n   - 오류 문구(미입력): “제목을 입력해 주세요.”\n   - 오류 문구(100자 초과): “제목은 100자 이내로 입력해 주세요.”\n3. 공개 구분 — 컴포넌트 `radio-group`\n   - 속성: {\"label\":\"공개 구분\",\"options\":[\"전체공개\",\"부분공개\"],\"value\":\"전체공개\",\"required\":true}\n   - 기획자 관점: 부분공개는 개인정보가 포함된 경우에만 선택. 선택 시 비공개 사유 입력란 노출\n   - 고객 관점: 자료를 어느 범위까지 공개할지 선택한다\n   - 옵션: 전체공개 / 부분공개 (기본값 전체공개)\n   - 유효성: 필수 · 검증 시점 제출 시\n4. 내용 — 컴포넌트 `textarea`\n   - 속성: {\"label\":\"내용\",\"placeholder\":\"자료 내용을 입력하세요 (2,000자 이내)\",\"required\":true}\n   - 기획자 관점: 최대 2,000자\n   - 고객 관점: 자료 내용을 요약해 적는다\n   - 유효성: 필수 · 0~2000자 · 검증 시점 제출 시\n   - 오류 문구(미입력): “내용을 입력해 주세요.”\n5. 첨부파일 — 컴포넌트 `file-upload`\n   - 속성: {\"label\":\"첨부파일\",\"hint\":\"PDF·HWP·HWPX, 파일당 20MB, 최대 5개\"}\n   - 기획자 관점: PDF·HWP·HWPX, 파일당 20MB, 최대 5개\n   - 고객 관점: 공개할 원문 파일을 올린다\n   - 유효성: 선택 · 검증 시점 입력 중\n   - 오류 문구(형식 오류): “PDF, HWP, HWPX 파일만 올릴 수 있습니다.”\n6. 하단 버튼 — 컴포넌트 `button-group` → 이동: CVL_INF_STS_010\n   - 속성: {\"buttons\":[{\"label\":\"임시저장\",\"variant\":\"secondary\",\"action\":\"toast\",\"message\":\"임시저장했습니다.\"},{\"label\":\"공개 신청\",\"variant\":\"primary\",\"action\":\"submit\",\"confirm\":\"입력한 내용으로 공개를 신청할까요?\",\"message\":\"공개 신청을 접수했습니다.\"}]}\n   - 기획자 관점: 공개 신청 시 확인 창 → 신청 완료 후 처리 현황으로 이동\n   - 고객 관점: 임시저장하거나 공개를 신청한다\n\n## 검토 기준\n1. 요구사항·Task의 동작이 화면에 모두 있는가 (빠진 요소, 빠진 상태: 빈 목록·오류·권한 없음)\n2. 설명은 기획자 관점(정책·노출 조건·규칙·예외)과 고객 관점(보이는 것·할 수 있는 것·안내 문구)으로만 썼는가. 개발자 관점은 빼기\n3. 선택 요소(셀렉트·라디오·체크·탭·필터·정렬)에 옵션 전체와 기본값이 있는가\n4. 입력 요소마다 필수 여부, 길이·형식, 검증 시점, 오류 문구가 있는가\n5. 참조자료(회의록 결정 등)와 어긋나는 내용이 없는가\n\n## 출력 형식\n1) 검토 결과 표: 번호 | 문제 | 근거(요구사항·자료 위치) | 수정안\n2) 완성본 JSON: 아래 형식의 `components` 배열 하나 (planning 도구에 그대로 넣습니다)\n```json\n{ \"screenId\": \"CVL_INF_REG_010\", \"components\": [ { \"no\": 1, \"label\": \"\", \"kind\": \"\", \"planner\": \"\", \"customer\": \"\", \"options\": { \"values\": [], \"default\": \"\" }, \"validation\": { \"required\": true, \"minLength\": 0, \"maxLength\": 0, \"timing\": [\"ON_SUBMIT\"], \"messages\": [{ \"condition\": \"\", \"text\": \"\" }] }, \"ui\": { \"component\": \"디자인 시스템 컴포넌트 ID\", \"props\": {}, \"link\": \"이동 화면 ID\" } } ] }\n```\n- 디자인 시스템에 없는 컴포넌트가 필요하면 JSON에 넣지 말고 ‘추가 필요 컴포넌트’로 따로 적어 주세요.\n","urls":[{"label":"공유 뷰어(현재 설계)","url":"https://claude.ai/artifact/X2QfnDTukesLPa4jD3XKLv#PUBINFO"},{"label":"참고 · 범정부 UI/UX 디자인 시스템(KRDS)","url":"https://www.krds.go.kr"}],"evidence":4},"sb:CVL_INF_STS_010":{"title":"화면설계서 CVL_INF_STS_010 처리 현황","figma":"# 요청: Figma에 화면설계서 그리기 — CVL_INF_STS_010 처리 현황\nFigma MCP 도구(use_figma 등)로 아래 화면을 Figma에 그려 주세요. 설명 없이 바로 작업하고, 끝나면 만든 프레임 링크와 요약을 알려 주세요.\n\n## 대상\n- 프로젝트: 정보공개 통합 서비스 구축 (PUBINFO, 작업 버전 v0.1, 신규 구축, 제출 양식 공공기관 제출용)\n- 시스템: CVL 민원포털 (주 사용자: 민원인(회원))\n- 화면: CVL_INF_STS_010 처리 현황 · 페이지 · 템플릿 list · Location: 정보공개 > 처리 현황\n- 요구사항·Task: SFR-002 대국민 정보공개 / SFR-002-T04 [CVL] 민원인: 처리 결과 확인, 반려 시 보완 후 재신청 (설계완료)\n\n## 참조 URL\n- 공유 뷰어(현재 설계): https://claude.ai/artifact/X2QfnDTukesLPa4jD3XKLv#PUBINFO\n- 참고 · 범정부 UI/UX 디자인 시스템(KRDS): https://www.krds.go.kr\n- Figma 파일이 등록되지 않았습니다. 새 파일을 만들고 링크를 알려 주세요.\n\n## 캔버스 규격 (줄바꿈 금지)\n- 프레임: 1920×1080 데스크톱 뷰포트 기준. 내용이 길면 높이만 늘린다(폭은 1920 고정).\n- 프레임 이름: `CVL_INF_STS_010 처리 현황`. 페이지 이름: `CVL 민원포털`\n- 메뉴·버튼·뱃지·표 머리글·라벨 텍스트는 Auto width(한 줄)로 두어 줄바꿈이 생기지 않게 한다. 본문 설명만 고정 폭 줄바꿈 허용.\n- 레이아웃은 Auto layout으로 만들고, 헤더·본문·푸터를 각각 그룹으로 나눈다.\n\n## 디자인 시스템 (CVL)\n- 컨셉: A. 단계 안내 신청형 — 신청 단계 표시와 넓은 입력 폼, 상단 메뉴. 처음 신청하는 민원인이 막히지 않게 한 단계씩 안내\n- 색상: 주 색 #1E6B52, 주 색 위 글자 #FFFFFF, 강조 #1B5FC1, 메뉴 배경 #FFFFFF, 메뉴 글자 #1B2420, 배경 #F4F7F5, 면 #FFFFFF, 보조 면 #E9F1EC, 선 #D1DDD5, 글자 #1B2420, 보조 글자 #6B7280, 성공 #1E7B4B, 주의 #B45309, 오류 #C0262D, 안내 #1D6FB8\n- 글꼴: Noto Sans KR · 크기(px) 메인 비주얼 38 / 화면 제목 30 / 구역 제목 23 / 소제목 19 / 본문 16 / 보조 15 / 캡션 14 · 굵게 700\n- 모서리 4/6/12px · 입력·버튼 높이 46px · 목록 행 높이 54px · 기본 간격 8px · 그림자 soft\n- 그리드: 12단, 콘텐츠 최대 폭 1080px, 단 간격 24px\n- 레이아웃 규칙: GNB 위치 상단, 로고 위치 왼쪽, 검색 영역 헤더 안, 목록 형태 표(그리드), 페이지네이션 번호, 버튼 모서리 둥근, 밀도 여유, 푸터 간단\n- 위 값은 Figma 변수(색·숫자)와 텍스트 스타일로 먼저 등록하고, 화면에서는 변수만 사용한다.\n\n## 사용 컴포넌트 (디자인 시스템에 있는 것만 사용)\n- `tabs` 탭 (변형: line, box) — 같은 화면 안 내용 전환\n- `data-table` 목록 표(그리드) (변형: table, card) — 총 건수, 정렬, 행 클릭 이동, 상태 뱃지 열\n- `pagination` 페이지네이션 (변형: numbered, numbered-size, more) — 처음·이전·번호·다음·마지막, 목록 개수 선택\n\n## 화면 구성 (위에서 아래 순서, 번호 = 설명 번호)\n1. 상태 탭 — 컴포넌트 `tabs`\n   - 속성: {\"items\":[\"전체 6\",\"심사중 2\",\"반려 1\",\"공개 3\"],\"active\":0}\n   - 기획자 관점: 전체·심사중·반려·공개 건수 표시\n   - 고객 관점: 처리 상태별로 신청 건을 본다\n2. 신청 목록 — 컴포넌트 `data-table` → 이동: CVL_INF_REG_010\n   - 속성: {\"total\":6,\"columns\":[\"신청번호\",\"제목\",\"신청일\",\"상태\"],\"badgeColumn\":3,\"rows\":[[\"2026-0931\",\"하천 수질 측정 결과\",\"2026-09-20\",\"공개\"],[\"2026-0927\",\"마을버스 노선 조정안\",\"2026-09-17\",\"반려\"],[\"2026-0915\",\"공공 체육시설 이용 현황(8월)\",\"2026-09-10\",\"심사중\"]]}\n   - 기획자 관점: 반려 건은 사유 보기·보완 신청 버튼 노출. 재신청 건은 [재신청] 표시\n   - 고객 관점: 내 신청 건의 처리 상태를 확인하고 반려 건을 보완한다\n3. 페이지 번호 — 컴포넌트 `pagination`\n   - 속성: {\"total\":6}\n   - 기획자 관점: 한 페이지 10건\n   - 고객 관점: 다음 페이지로 이동한다\n\n## 화면설계서 표기\n- 각 요소 왼쪽 위에 번호 마커(빨간 원 #E5484D, 지름 22, 흰 숫자)를 둔다.\n- 프레임 오른쪽에 설명 패널(폭 560)을 붙인다: 머리글(화면 ID CVL_INF_STS_010 · 화면명 · 시스템 · Location), 번호별 [기획] [고객] 설명, 옵션, 유효성·오류 문구.\n- 개발자 관점 설명(API, DB, 구현 방법)은 넣지 않는다.\n- 공공기관 제출 양식: 한 장(16:9)에 설명이 넘치면 같은 화면 ID로 다음 장을 만들고, 앞 장 아래에 “다음 페이지에 계속 ▶”, 다음 장 위에 “◀ 이전 페이지에서 계속”, 머리글에 (1/2) 표시.\n\n## 참조자료 근거\n- [SRC-001 제안요청서(요약) · 2. 사업 범위] 2. 사업 범위 - 대국민 포털: 정보공개 목록·상세 조회, 통합 검색 - 민원포털: 회원가입·로그인, 자료 등록 및 공개 신청, 처리 현황 조회, 보완 후 재신청 - 심사자·관리자 시스템: 신청 목록, 심사(승인·반려), 심사 이력 관리 - 외부 연계: 국가 정보공개 포털 전송\n- [SRC-002 착수보고 회의록 · 문단 4] 2. 심사 절차 심사자는 신청 건을 검토한 뒤 승인 또는 반려한다. 반려 시 사유 입력은 필수이며 100자 이상 작성하도록 한다. 반려된 건은 민원인이 보완 후 재신청할 수 있고, 재신청 건은 목록에서 구분되어야 한다.\n- [SRC-001 제안요청서(요약) · 4. 화면·접근성 요구사항] 4. 화면·접근성 요구사항 - 대국민 포털은 범정부 UI/UX 가이드라인(KRDS)의 구성 원칙을 따르고 한국형 웹 콘텐츠 접근성 지침 2.2를 준수한다. - 목록 화면은 검색 조건, 총 건수, 페이지 번호를 제공한다. - 심사자 시스템은 하루 종일 쓰는 업무 화면이므로 한 화면에 많은 목록을 볼 수 있게 한다.\n- [SRC-001 제안요청서(요약) · SFR-002 대국민 정보공개] SFR-002 대국민 정보공개 민원인이 등록한 자료를 심사자가 검토·승인하면 대국민 포털에 공개한다. 반려된 자료는 민원인이 사유를 확인하고 보완 후 재신청할 수 있어야 한다. 공개 구분은 전체공개와 부분공개로 나누며, 부분공개일 때는 비공개 사유를 입력한다.\n\n## 지켜 주세요\n- 디자인 시스템에 없는 컴포넌트가 필요하면 새로 그리지 말고 목록으로 알려 주세요(디자인 시스템에 먼저 추가합니다).\n- 문구는 위 내용을 그대로 쓰고, 없는 내용은 지어내지 말고 ‘확인 필요’로 표시해 주세요.\n","claude":"# 요청: 화면설계서 검토·보완 — CVL_INF_STS_010 처리 현황\n아래 화면설계서를 요구사항과 참조자료 근거에 비추어 검토하고, 빠진 항목을 채운 완성본을 돌려주세요.\n\n## 대상\n- 프로젝트: 정보공개 통합 서비스 구축 (PUBINFO, 작업 버전 v0.1, 신규 구축, 제출 양식 공공기관 제출용)\n- 시스템: CVL 민원포털 (주 사용자: 민원인(회원))\n- 화면: CVL_INF_STS_010 처리 현황 · 페이지 · 템플릿 list · Location: 정보공개 > 처리 현황\n- 요구사항·Task: SFR-002 대국민 정보공개 / SFR-002-T04 [CVL] 민원인: 처리 결과 확인, 반려 시 보완 후 재신청 (설계완료)\n\n## 참조 URL\n- 공유 뷰어(현재 설계): https://claude.ai/artifact/X2QfnDTukesLPa4jD3XKLv#PUBINFO\n- 참고 · 범정부 UI/UX 디자인 시스템(KRDS): https://www.krds.go.kr\n\n## 요구사항 원문\n- SFR-002 대국민 정보공개: 민원인이 등록한 자료를 심사자가 검토·승인하면 대국민 포털에 공개한다.\n\n## 참조자료 근거\n- [SRC-001 제안요청서(요약) · 2. 사업 범위] 2. 사업 범위 - 대국민 포털: 정보공개 목록·상세 조회, 통합 검색 - 민원포털: 회원가입·로그인, 자료 등록 및 공개 신청, 처리 현황 조회, 보완 후 재신청 - 심사자·관리자 시스템: 신청 목록, 심사(승인·반려), 심사 이력 관리 - 외부 연계: 국가 정보공개 포털 전송\n- [SRC-002 착수보고 회의록 · 문단 4] 2. 심사 절차 심사자는 신청 건을 검토한 뒤 승인 또는 반려한다. 반려 시 사유 입력은 필수이며 100자 이상 작성하도록 한다. 반려된 건은 민원인이 보완 후 재신청할 수 있고, 재신청 건은 목록에서 구분되어야 한다.\n- [SRC-001 제안요청서(요약) · 4. 화면·접근성 요구사항] 4. 화면·접근성 요구사항 - 대국민 포털은 범정부 UI/UX 가이드라인(KRDS)의 구성 원칙을 따르고 한국형 웹 콘텐츠 접근성 지침 2.2를 준수한다. - 목록 화면은 검색 조건, 총 건수, 페이지 번호를 제공한다. - 심사자 시스템은 하루 종일 쓰는 업무 화면이므로 한 화면에 많은 목록을 볼 수 있게 한다.\n- [SRC-001 제안요청서(요약) · SFR-002 대국민 정보공개] SFR-002 대국민 정보공개 민원인이 등록한 자료를 심사자가 검토·승인하면 대국민 포털에 공개한다. 반려된 자료는 민원인이 사유를 확인하고 보완 후 재신청할 수 있어야 한다. 공개 구분은 전체공개와 부분공개로 나누며, 부분공개일 때는 비공개 사유를 입력한다.\n\n## 디자인 시스템 (CVL)\n- 컨셉: A. 단계 안내 신청형 — 신청 단계 표시와 넓은 입력 폼, 상단 메뉴. 처음 신청하는 민원인이 막히지 않게 한 단계씩 안내\n- 색상: 주 색 #1E6B52, 주 색 위 글자 #FFFFFF, 강조 #1B5FC1, 메뉴 배경 #FFFFFF, 메뉴 글자 #1B2420, 배경 #F4F7F5, 면 #FFFFFF, 보조 면 #E9F1EC, 선 #D1DDD5, 글자 #1B2420, 보조 글자 #6B7280, 성공 #1E7B4B, 주의 #B45309, 오류 #C0262D, 안내 #1D6FB8\n- 글꼴: Noto Sans KR · 크기(px) 메인 비주얼 38 / 화면 제목 30 / 구역 제목 23 / 소제목 19 / 본문 16 / 보조 15 / 캡션 14 · 굵게 700\n- 모서리 4/6/12px · 입력·버튼 높이 46px · 목록 행 높이 54px · 기본 간격 8px · 그림자 soft\n- 그리드: 12단, 콘텐츠 최대 폭 1080px, 단 간격 24px\n- 레이아웃 규칙: GNB 위치 상단, 로고 위치 왼쪽, 검색 영역 헤더 안, 목록 형태 표(그리드), 페이지네이션 번호, 버튼 모서리 둥근, 밀도 여유, 푸터 간단\n\n## 쓸 수 있는 컴포넌트\n- `gnb` GNB (주 메뉴) (변형: top, top-mega, side) — 로고, 1depth 메뉴, 유틸리티(로그인·마이페이지). 레이아웃 규칙에 따라 상단 또는 좌측\n- `lnb` LNB (하위 메뉴) — 2depth 이하 메뉴. 상단 GNB형에서 하위 페이지 좌측에 표시\n- `breadcrumb` 현재 위치(Location) — 홈 > 1depth > 2depth\n- `tabs` 탭 (변형: line, box) — 같은 화면 안 내용 전환\n- `step-indicator` 단계 표시 — 신청 절차의 현재 단계\n- `footer` 푸터 (변형: full, simple) — 기관 정보, 개인정보처리방침, 저작권\n- `search-bar` 검색창 (변형: header, hero, inline) — 키워드 입력 + 검색 버튼\n- `search-panel` 검색 조건 영역 — 목록 위 조건(기간·구분·상태·키워드)과 조회·초기화 버튼\n- `data-table` 목록 표(그리드) (변형: table, card) — 총 건수, 정렬, 행 클릭 이동, 상태 뱃지 열\n- `card-list` 카드 목록 — 썸네일·제목·요약·메타 정보 카드\n- `pagination` 페이지네이션 (변형: numbered, numbered-size, more) — 처음·이전·번호·다음·마지막, 목록 개수 선택\n- `detail-table` 상세 정보 표 — 항목명-값 2열 표\n- `status-badge` 상태 뱃지 (변형: neutral, info, success, warning, danger) — 처리 상태 표시 (공통 상태값 사용)\n- `file-list` 첨부파일 목록 — 파일명·용량·내려받기\n- `stat-cards` 요약 수치 카드 — 대시보드 건수 요약\n- `notice-list` 게시물 요약 목록 — 공지·새소식 최근 N건\n- `empty-state` 빈 화면 안내 — 데이터가 없을 때 안내 문구\n- `hero-banner` 메인 비주얼 — 메인 상단 대표 문구·검색\n- `quick-links` 바로가기 — 자주 쓰는 서비스 아이콘 링크\n- `login-form` 로그인 폼 — 아이디·비밀번호, 간편인증, 찾기 링크\n- `text-input` 입력창 (변형: default, error, disabled) — 라벨, 필수 표시, 안내·오류 문구\n- `textarea` 여러 줄 입력 — 글자 수 표시\n- `select` 선택 목록 — 옵션 목록, 기본값\n- `radio-group` 라디오 버튼 — 하나만 선택\n- `checkbox-group` 체크박스 — 여러 개 선택, 약관 동의\n- `date-range` 기간 선택 — 시작일~종료일, 빠른 기간 버튼\n- `file-upload` 파일 첨부 — 허용 형식·용량 안내, 첨부 목록\n- `button` 버튼 (변형: primary, secondary, tertiary, danger) — 주요·보조·텍스트 버튼\n- `button-group` 버튼 영역 — 화면 하단 주요 동작 버튼 묶음\n- `confirm-dialog` 확인 창(컨펌) — 되돌릴 수 없는 동작 전 확인. 확인·취소\n- `alert-dialog` 알림 창(얼럿) — 결과·오류 안내. 확인 버튼 하나\n- `toast` 토스트 (변형: success, info, danger) — 잠시 나타났다 사라지는 처리 결과 알림\n- `modal` 모달 팝업 — 화면 위 레이어 팝업. 제목·본문·닫기\n\n## 현재 화면설계서\n1. 상태 탭 — 컴포넌트 `tabs`\n   - 속성: {\"items\":[\"전체 6\",\"심사중 2\",\"반려 1\",\"공개 3\"],\"active\":0}\n   - 기획자 관점: 전체·심사중·반려·공개 건수 표시\n   - 고객 관점: 처리 상태별로 신청 건을 본다\n2. 신청 목록 — 컴포넌트 `data-table` → 이동: CVL_INF_REG_010\n   - 속성: {\"total\":6,\"columns\":[\"신청번호\",\"제목\",\"신청일\",\"상태\"],\"badgeColumn\":3,\"rows\":[[\"2026-0931\",\"하천 수질 측정 결과\",\"2026-09-20\",\"공개\"],[\"2026-0927\",\"마을버스 노선 조정안\",\"2026-09-17\",\"반려\"],[\"2026-0915\",\"공공 체육시설 이용 현황(8월)\",\"2026-09-10\",\"심사중\"]]}\n   - 기획자 관점: 반려 건은 사유 보기·보완 신청 버튼 노출. 재신청 건은 [재신청] 표시\n   - 고객 관점: 내 신청 건의 처리 상태를 확인하고 반려 건을 보완한다\n3. 페이지 번호 — 컴포넌트 `pagination`\n   - 속성: {\"total\":6}\n   - 기획자 관점: 한 페이지 10건\n   - 고객 관점: 다음 페이지로 이동한다\n\n## 검토 기준\n1. 요구사항·Task의 동작이 화면에 모두 있는가 (빠진 요소, 빠진 상태: 빈 목록·오류·권한 없음)\n2. 설명은 기획자 관점(정책·노출 조건·규칙·예외)과 고객 관점(보이는 것·할 수 있는 것·안내 문구)으로만 썼는가. 개발자 관점은 빼기\n3. 선택 요소(셀렉트·라디오·체크·탭·필터·정렬)에 옵션 전체와 기본값이 있는가\n4. 입력 요소마다 필수 여부, 길이·형식, 검증 시점, 오류 문구가 있는가\n5. 참조자료(회의록 결정 등)와 어긋나는 내용이 없는가\n\n## 출력 형식\n1) 검토 결과 표: 번호 | 문제 | 근거(요구사항·자료 위치) | 수정안\n2) 완성본 JSON: 아래 형식의 `components` 배열 하나 (planning 도구에 그대로 넣습니다)\n```json\n{ \"screenId\": \"CVL_INF_STS_010\", \"components\": [ { \"no\": 1, \"label\": \"\", \"kind\": \"\", \"planner\": \"\", \"customer\": \"\", \"options\": { \"values\": [], \"default\": \"\" }, \"validation\": { \"required\": true, \"minLength\": 0, \"maxLength\": 0, \"timing\": [\"ON_SUBMIT\"], \"messages\": [{ \"condition\": \"\", \"text\": \"\" }] }, \"ui\": { \"component\": \"디자인 시스템 컴포넌트 ID\", \"props\": {}, \"link\": \"이동 화면 ID\" } } ] }\n```\n- 디자인 시스템에 없는 컴포넌트가 필요하면 JSON에 넣지 말고 ‘추가 필요 컴포넌트’로 따로 적어 주세요.\n","urls":[{"label":"공유 뷰어(현재 설계)","url":"https://claude.ai/artifact/X2QfnDTukesLPa4jD3XKLv#PUBINFO"},{"label":"참고 · 범정부 UI/UX 디자인 시스템(KRDS)","url":"https://www.krds.go.kr"}],"evidence":4},"sb:ADM_INF_REV_010":{"title":"화면설계서 ADM_INF_REV_010 심사 목록","figma":"# 요청: Figma에 화면설계서 그리기 — ADM_INF_REV_010 심사 목록\nFigma MCP 도구(use_figma 등)로 아래 화면을 Figma에 그려 주세요. 설명 없이 바로 작업하고, 끝나면 만든 프레임 링크와 요약을 알려 주세요.\n\n## 대상\n- 프로젝트: 정보공개 통합 서비스 구축 (PUBINFO, 작업 버전 v0.1, 신규 구축, 제출 양식 공공기관 제출용)\n- 시스템: ADM 심사자·관리자 시스템 (주 사용자: 심사자, 운영 관리자)\n- 화면: ADM_INF_REV_010 심사 목록 · 페이지 · 템플릿 list · Location: 정보공개 심사 > 심사 목록\n- 요구사항·Task: SFR-002 대국민 정보공개 / SFR-002-T02 [ADM] 심사자: 신청 목록 조회 및 내용 검토 (설계완료)\n\n## 참조 URL\n- 공유 뷰어(현재 설계): https://claude.ai/artifact/X2QfnDTukesLPa4jD3XKLv#PUBINFO\n- 참고 · 범정부 UI/UX 디자인 시스템(KRDS): https://www.krds.go.kr\n- Figma 파일이 등록되지 않았습니다. 새 파일을 만들고 링크를 알려 주세요.\n\n## 캔버스 규격 (줄바꿈 금지)\n- 프레임: 1920×1080 데스크톱 뷰포트 기준. 내용이 길면 높이만 늘린다(폭은 1920 고정).\n- 프레임 이름: `ADM_INF_REV_010 심사 목록`. 페이지 이름: `ADM 심사자·관리자 시스템`\n- 메뉴·버튼·뱃지·표 머리글·라벨 텍스트는 Auto width(한 줄)로 두어 줄바꿈이 생기지 않게 한다. 본문 설명만 고정 폭 줄바꿈 허용.\n- 레이아웃은 Auto layout으로 만들고, 헤더·본문·푸터를 각각 그룹으로 나눈다.\n\n## 디자인 시스템 (ADM)\n- 컨셉: A. 좌측 메뉴 업무형 — 어두운 좌측 메뉴, 조건 검색 패널, 촘촘한 표와 목록 개수 선택. 오래 쓰는 업무 화면에 맞춘 구성\n- 색상: 주 색 #2257A8, 주 색 위 글자 #FFFFFF, 강조 #0F8A6C, 메뉴 배경 #1F2A3C, 메뉴 글자 #E6EBF2, 배경 #F3F5F8, 면 #FFFFFF, 보조 면 #EBEEF3, 선 #D4DAE3, 글자 #1C232D, 보조 글자 #6B7280, 성공 #1E7B4B, 주의 #B45309, 오류 #C0262D, 안내 #1D6FB8\n- 글꼴: IBM Plex Sans KR · 크기(px) 메인 비주얼 34 / 화면 제목 26 / 구역 제목 20 / 소제목 17 / 본문 14 / 보조 13 / 캡션 12 · 굵게 700\n- 모서리 2/4/8px · 입력·버튼 높이 34px · 목록 행 높이 40px · 기본 간격 6px · 그림자 none\n- 그리드: 12단, 콘텐츠 최대 폭 1600px, 단 간격 24px\n- 레이아웃 규칙: GNB 위치 좌측 사이드, 로고 위치 왼쪽, 검색 영역 목록 위 조건 패널, 목록 형태 표(그리드), 페이지네이션 번호 + 목록 개수 선택, 버튼 모서리 각진, 밀도 촘촘, 푸터 없음\n- 위 값은 Figma 변수(색·숫자)와 텍스트 스타일로 먼저 등록하고, 화면에서는 변수만 사용한다.\n\n## 사용 컴포넌트 (디자인 시스템에 있는 것만 사용)\n- `search-panel` 검색 조건 영역 — 목록 위 조건(기간·구분·상태·키워드)과 조회·초기화 버튼\n- `data-table` 목록 표(그리드) (변형: table, card) — 총 건수, 정렬, 행 클릭 이동, 상태 뱃지 열\n- `pagination` 페이지네이션 (변형: numbered, numbered-size, more) — 처음·이전·번호·다음·마지막, 목록 개수 선택\n\n## 화면 구성 (위에서 아래 순서, 번호 = 설명 번호)\n1. 검색 조건 — 컴포넌트 `search-panel`\n   - 속성: {\"fields\":[{\"label\":\"신청일\",\"type\":\"date-range\"},{\"label\":\"상태\",\"type\":\"select\",\"options\":[\"전체\",\"공개신청\",\"심사중\",\"승인\",\"반려\"]},{\"label\":\"검색어\",\"type\":\"text\",\"placeholder\":\"제목·신청인\"}]}\n   - 기획자 관점: 기본값: 상태=공개신청\n   - 고객 관점: 심사할 건을 상태·기간으로 찾는다\n   - 옵션: 전체 / 공개신청 / 심사중 / 승인 / 반려 (기본값 공개신청) · 상태 (공통 상태값 ST-INFO)\n2. 심사 대상 목록 — 컴포넌트 `data-table` → 이동: ADM_INF_REV_010_P01\n   - 속성: {\"total\":42,\"columns\":[\"신청번호\",\"제목\",\"신청인\",\"신청일\",\"상태\"],\"badgeColumn\":4,\"rows\":[[\"2026-0934\",\"구청 청사 에너지 사용량\",\"김○○\",\"2026-09-24\",\"공개신청\"],[\"2026-0933\",\"[재신청] 마을버스 노선 조정안\",\"이○○\",\"2026-09-23\",\"공개신청\"],[\"2026-0930\",\"도서관 좌석 이용률\",\"박○○\",\"2026-09-21\",\"심사중\"],[\"2026-0928\",\"하천 수질 측정 결과\",\"최○○\",\"2026-09-20\",\"승인\"]]}\n   - 기획자 관점: 한 화면 최대 50건(회의록). 재신청 건은 [재신청] 표시. 행 클릭 시 승인·반려 처리 팝업\n   - 고객 관점: 심사자가 신청 건을 훑어보고 처리할 건을 연다\n   - 옵션: 10 / 30 / 50 (기본값 30) · 목록 개수\n3. 페이지 번호 — 컴포넌트 `pagination`\n   - 속성: {\"total\":42}\n   - 기획자 관점: 목록 개수 10/30/50\n   - 고객 관점: 다음 페이지로 이동한다\n\n## 화면설계서 표기\n- 각 요소 왼쪽 위에 번호 마커(빨간 원 #E5484D, 지름 22, 흰 숫자)를 둔다.\n- 프레임 오른쪽에 설명 패널(폭 560)을 붙인다: 머리글(화면 ID ADM_INF_REV_010 · 화면명 · 시스템 · Location), 번호별 [기획] [고객] 설명, 옵션, 유효성·오류 문구.\n- 개발자 관점 설명(API, DB, 구현 방법)은 넣지 않는다.\n- 공공기관 제출 양식: 한 장(16:9)에 설명이 넘치면 같은 화면 ID로 다음 장을 만들고, 앞 장 아래에 “다음 페이지에 계속 ▶”, 다음 장 위에 “◀ 이전 페이지에서 계속”, 머리글에 (1/2) 표시.\n\n## 참조자료 근거\n- [SRC-001 제안요청서(요약) · 2. 사업 범위] 2. 사업 범위 - 대국민 포털: 정보공개 목록·상세 조회, 통합 검색  로그인] SFR-001 민원인 회원가입 및 로그인 민원인은 본인인증을 거쳐 회원가입하고 아이디·비밀번호 또는 간편인증으로 로그인한다. 비밀번호는 9자 이상, 영문·숫자·특수문자를 모두 포함해야 한다.\n\n## 디자인 시스템 (ADM)\n- 컨셉: A. 좌측 메뉴 업무형 — 어두운 좌측 메뉴, 조건 검색 패널, 촘촘한 표와 목록 개수 선택. 오래 쓰는 업무 화면에 맞춘 구성\n- 색상: 주 색 #2257A8, 주 색 위 글자 #FFFFFF, 강조 #0F8A6C, 메뉴 배경 #1F2A3C, 메뉴 글자 #E6EBF2, 배경 #F3F5F8, 면 #FFFFFF, 보조 면 #EBEEF3, 선 #D4DAE3, 글자 #1C232D, 보조 글자 #6B7280, 성공 #1E7B4B, 주의 #B45309, 오류 #C0262D, 안내 #1D6FB8\n- 글꼴: IBM Plex Sans KR · 크기(px) 메인 비주얼 34 / 화면 제목 26 / 구역 제목 20 / 소제목 17 / 본문 14 / 보조 13 / 캡션 12 · 굵게 700\n- 모서리 2/4/8px · 입력·버튼 높이 34px · 목록 행 높이 40px · 기본 간격 6px · 그림자 none\n- 그리드: 12단, 콘텐츠 최대 폭 1600px, 단 간격 24px\n- 레이아웃 규칙: GNB 위치 좌측 사이드, 로고 위치 왼쪽, 검색 영역 목록 위 조건 패널, 목록 형태 표(그리드), 페이지네이션 번호 + 목록 개수 선택, 버튼 모서리 각진, 밀도 촘촘, 푸터 없음\n\n## 쓸 수 있는 컴포넌트\n- `gnb` GNB (주 메뉴) (변형: top, top-mega, side) — 로고, 1depth 메뉴, 유틸리티(로그인·마이페이지). 레이아웃 규칙에 따라 상단 또는 좌측\n- `lnb` LNB (하위 메뉴) — 2depth 이하 메뉴. 상단 GNB형에서 하위 페이지 좌측에 표시\n- `breadcrumb` 현재 위치(Location) — 홈 > 1depth > 2depth\n- `tabs` 탭 (변형: line, box) — 같은 화면 안 내용 전환\n- `step-indicator` 단계 표시 — 신청 절차의 현재 단계\n- `footer` 푸터 (변형: full, simple) — 기관 정보, 개인정보처리방침, 저작권\n- `search-bar` 검색창 (변형: header, hero, inline) — 키워드 입력 + 검색 버튼\n- `search-panel` 검색 조건 영역 — 목록 위 조건(기간·구분·상태·키워드)과 조회·초기화 버튼\n- `data-table` 목록 표(그리드) (변형: table, card) — 총 건수, 정렬, 행 클릭 이동, 상태 뱃지 열\n- `card-list` 카드 목록 — 썸네일·제목·요약·메타 정보 카드\n- `pagination` 페이지네이션 (변형: numbered, numbered-size, more) — 처음·이전·번호·다음·마지막, 목록 개수 선택\n- `detail-table` 상세 정보 표 — 항목명-값 2열 표\n- `status-badge` 상태 뱃지 (변형: neutral, info, success, warning, danger) — 처리 상태 표시 (공통 상태값 사용)\n- `file-list` 첨부파일 목록 — 파일명·용량·내려받기\n- `stat-cards` 요약 수치 카드 — 대시보드 건수 요약\n- `notice-list` 게시물 요약 목록 — 공지·새소식 최근 N건\n- `empty-state` 빈 화면 안내 — 데이터가 없을 때 안내 문구\n- `hero-banner` 메인 비주얼 — 메인 상단 대표 문구·검색\n- `quick-links` 바로가기 — 자주 쓰는 서비스 아이콘 링크\n- `login-form` 로그인 폼 — 아이디·비밀번호, 간편인증, 찾기 링크\n- `text-input` 입력창 (변형: default, error, disabled) — 라벨, 필수 표시, 안내·오류 문구\n- `textarea` 여러 줄 입력 — 글자 수 표시\n- `select` 선택 목록 — 옵션 목록, 기본값\n- `radio-group` 라디오 버튼 — 하나만 선택\n- `checkbox-group` 체크박스 — 여러 개 선택, 약관 동의\n- `date-range` 기간 선택 — 시작일~종료일, 빠른 기간 버튼\n- `file-upload` 파일 첨부 — 허용 형식·용량 안내, 첨부 목록\n- `button` 버튼 (변형: primary, secondary, tertiary, danger) — 주요·보조·텍스트 버튼\n- `button-group` 버튼 영역 — 화면 하단 주요 동작 버튼 묶음\n- `confirm-dialog` 확인 창(컨펌) — 되돌릴 수 없는 동작 전 확인. 확인·취소\n- `alert-dialog` 알림 창(얼럿) — 결과·오류 안내. 확인 버튼 하나\n- `toast` 토스트 (변형: success, info, danger) — 잠시 나타났다 사라지는 처리 결과 알림\n- `modal` 모달 팝업 — 화면 위 레이어 팝업. 제목·본문·닫기\n- `review-timeline` 심사 이력 타임라인 [추가 · SFR-003-T01] — 일시·처리자·처리 결과·사유를 시간 순으로 표시\n\n## 현재 화면설계서\n1. 검색 조건 — 컴포넌트 `search-panel`\n   - 속성: {\"fields\":[{\"label\":\"신청일\",\"type\":\"date-range\"},{\"label\":\"상태\",\"type\":\"select\",\"options\":[\"전체\",\"공개신청\",\"심사중\",\"승인\",\"반려\"]},{\"label\":\"검색어\",\"type\":\"text\",\"placeholder\":\"제목·신청인\"}]}\n   - 기획자 관점: 기본값: 상태=공개신청\n   - 고객 관점: 심사할 건을 상태·기간으로 찾는다\n   - 옵션: 전체 / 공개신청 / 심사중 / 승인 / 반려 (기본값 공개신청) · 상태 (공통 상태값 ST-INFO)\n2. 심사 대상 목록 — 컴포넌트 `data-table` → 이동: ADM_INF_REV_010_P01\n   - 속성: {\"total\":42,\"columns\":[\"신청번호\",\"제목\",\"신청인\",\"신청일\",\"상태\"],\"badgeColumn\":4,\"rows\":[[\"2026-0934\",\"구청 청사 에너지 사용량\",\"김○○\",\"2026-09-24\",\"공개신청\"],[\"2026-0933\",\"[재신청] 마을버스 노선 조정안\",\"이○○\",\"2026-09-23\",\"공개신청\"],[\"2026-0930\",\"도서관 좌석 이용률\",\"박○○\",\"2026-09-21\",\"심사중\"],[\"2026-0928\",\"하천 수질 측정 결과\",\"최○○\",\"2026-09-20\",\"승인\"]]}\n   - 기획자 관점: 한 화면 최대 50건(회의록). 재신청 건은 [재신청] 표시. 행 클릭 시 승인·반려 처리 팝업\n   - 고객 관점: 심사자가 신청 건을 훑어보고 처리할 건을 연다\n   - 옵션: 10 / 30 / 50 (기본값 30) · 목록 개수\n3. 페이지 번호 — 컴포넌트 `pagination`\n   - 속성: {\"total\":42}\n   - 기획자 관점: 목록 개수 10/30/50\n   - 고객 관점: 다음 페이지로 이동한다\n\n## 검토 기준\n1. 요구사항·Task의 동작이 화면에 모두 있는가 (빠진 요소, 빠진 상태: 빈 목록·오류·권한 없음)\n2. 설명은 기획자 관점(정책·노출 조건·규칙·예외)과 고객 관점(보이는 것·할 수 있는 것·안내 문구)으로만 썼는가. 개발자 관점은 빼기\n3. 선택 요소(셀렉트·라디오·체크·탭·필터·정렬)에 옵션 전체와 기본값이 있는가\n4. 입력 요소마다 필수 여부, 길이·형식, 검증 시점, 오류 문구가 있는가\n5. 참조자료(회의록 결정 등)와 어긋나는 내용이 없는가\n\n## 출력 형식\n1) 검토 결과 표: 번호 | 문제 | 근거(요구사항·자료 위치) | 수정안\n2) 완성본 JSO
